# Rendu d'exécution de cette expérience, montré dans l'onglet « Exécutions » de l'IHM.
# Format : pilotage/README.md. Pages écrites avant le lancement, complétées après (2026-11-16).
executions:
  - id: X-005
    titre: "Réglages de prédiction : lesquels vont plus vite sur notre carte ?"
    date: 2026-11-16
    statut: terminee
    piste: P-420
    taches: [T-015]
    resume: >-
      Premier point de l'ordre d'essai issu de la veille. Quatre réglages de prédiction, tous déjà
      présents dans notre installation de villa, sont comparés sur une même zone du segment : le
      nôtre (lot de 4, modèle compilé), puis sans compilation, puis en lot de 8, puis avec des fils
      de lecture et un cache.

    bilan:
      - question: "Le type de résultat"
        valeur: "Des durées, un débit, un pic de mémoire vidéo"
        detail: >-
          Pour chaque réglage : le temps pris par une petite zone et par une zone quatre fois plus
          large, d'où un débit en blocs par seconde hors démarrage, et ce que coûte le démarrage.
          Les images sont ensuite comparées pixel à pixel à celle du réglage actuel. Aucun modèle
          n'est entraîné, aucune image nouvelle à regarder.
      - question: "La représentativité"
        valeur: "1 % du segment, autour d'une rangée de formes"
        detail: >-
          La grande zone fait 2 048 × 8 192 pixels, sur une image de 32 249 × 51 380. C'est assez
          pour un débit, pas pour dire comment la mémoire vive se comporte sur des heures.
      - question: "Ce que cela doit décider"
        valeur: "Le réglage des prochaines prédictions"
        detail: >-
          X-003 a pris 5 h 34 en lot de 4 compilé, à 17,3 blocs par seconde. Si un autre réglage
          fait mieux ici sans changer l'image, il devient notre réglage par défaut. Réponse,
          avec la seconde passe X-006 : aucun ne fait mieux sur la grande zone.
        fiches: [K-12]

    code:
      - titre: "Les quatre réglages et leur mesure"
        fichier: experiments/2026-11-16-reglages-de-prediction/etapes.sh
        langage: bash
        extrait: [12, 54]
        notes:
          - lignes: [13, 14]
            genre: mesure
            titre: "Deux zones, pour séparer le démarrage du calcul"
            texte: >-
              Les mêmes lignes (7 000 à 9 048, là où X-003 montre une rangée de formes), sur 2 048
              puis 8 192 colonnes. Le démarrage coûte le même temps dans les deux cas : la
              différence de durée entre les deux ne vient que des blocs en plus. Sans cela, un
              réglage qui compile le modèle au départ paraîtrait lent sur une petite zone, alors
              que ce coût disparaît sur une prédiction de plusieurs heures.
          - lignes: 15
            genre: parametrage
            titre: "Une limite de 25 minutes par mesure"
            texte: >-
              Sous WSL2, manquer de mémoire vidéo ne produit pas d'erreur mais un ralentissement
              d'environ 25 fois, selon la proposition villa 2298. Un lot de 8 peut déborder de nos
              8 Go : la limite évite d'y passer des heures, et la mesure est alors notée comme
              non terminée.
            fiches: [K-14]
          - lignes: [31, 35]
            genre: mesure
            titre: "Le pic de mémoire vidéo, réglage par réglage"
            texte: >-
              Relevé chaque seconde pendant la mesure. Il comprend ce que Windows occupe déjà sur
              la carte, environ 1,4 Go au moment d'écrire cette page.
          - lignes: [37, 38]
            genre: parametrage
            titre: "La même commande que X-003, sur un rectangle"
            texte: >-
              `predire-par-bandes.sh` avec une seule bande de 2 048 lignes. Seules les options
              ajoutées à la fin changent d'un réglage à l'autre.
            fiches: [K-12]
          - lignes: [49, 51]
            genre: optimisation
            titre: "Les quatre réglages"
            texte: >-
              Le nôtre d'abord. `--no-compile` renonce à la compilation du modèle au démarrage.
              `--batch-size 8` passe huit blocs à la fois au lieu de quatre. `--loader-threads 8`
              lit les blocs par des fils plutôt que par un processus à part, et
              `--chunk-cache-size 64` garde en mémoire les morceaux du volume déjà décodés, que
              des blocs qui se chevauchent redemandent. Sur une RTX 4090 et un autre modèle,
              [gomyway](https://github.com/gomyway) mesure 61,6 s pour le lot de 4 compilé, 11,6 à
              11,9 s pour le lot de 8 sans compilation, 10,1 s avec les fils et le cache.

      - titre: "Le calcul du débit"
        fichier: experiments/2026-11-16-reglages-de-prediction/tableau.py
        langage: python
        extrait: [22, 34]
        notes:
          - lignes: [28, 29]
            genre: mesure
            titre: "Une pente entre deux points"
            texte: >-
              Débit : blocs en plus divisés par secondes en plus. Démarrage : ce qui reste de la
              petite zone une fois ses blocs retirés à ce débit. Avec deux points seulement, il
              n'y a pas de marge d'erreur : un écart de quelques pour cent entre deux réglages ne
              voudra rien dire.

    sorties:
      - genre: mesures
        titre: "Les huit mesures, dans l'ordre où elles ont tourné"
        large: true
        lignes:
          - ["Lot de 4, compilé : petite zone, 1 122 blocs", "153,7 s", "première mesure : le volume n'avait jamais été lu"]
          - ["Lot de 4, compilé : grande zone, 4 386 blocs", "223,5 s", "pic de mémoire vidéo 4 151 Mo"]
          - ["Lot de 4, sans compilation : petite zone", "86,5 s", ""]
          - ["Lot de 4, sans compilation : grande zone", "230,1 s", "pic 4 391 Mo"]
          - ["Lot de 8, sans compilation : petite zone", "70,5 s", ""]
          - ["Lot de 8, sans compilation : grande zone", "238,1 s", "pic 6 707 Mo, sur 8 192"]
          - ["Lot de 8, fils de lecture et cache : petite zone", "70,8 s", ""]
          - ["Lot de 8, fils de lecture et cache : grande zone", "239,3 s", "pic 6 707 Mo"]
        note: >-
          Sur la grande zone, les quatre réglages tiennent entre 223,5 et 239,3 s : 7 % d'écart
          entre le plus rapide et le plus lent, avec une seule passe. Aucun réglage n'a atteint la
          limite de 25 minutes : le lot de 8 ne déborde pas de la mémoire vidéo.
      - genre: mesures
        titre: "Débit et démarrage, calculés entre les deux zones"
        large: true
        lignes:
          - ["Lot de 4, compilé", "46,8 blocs/s, démarrage 130 s", "non fiable : la petite zone a payé la première lecture du volume"]
          - ["Lot de 4, sans compilation", "22,7 blocs/s, démarrage 37 s", ""]
          - ["Lot de 8, sans compilation", "19,5 blocs/s, démarrage 13 s", ""]
          - ["Lot de 8, fils de lecture et cache", "19,4 blocs/s, démarrage 13 s", ""]
        note: >-
          La limite annoncée avant de lancer s'est réalisée : le premier réglage mesuré n'est pas
          comparable aux autres. Son débit de 46,8 blocs par seconde ne doit pas être retenu.
          X-006 refait les huit mesures une fois le volume déjà lu.
      - genre: mesures
        titre: "Les images, comparées à celle du lot de 4 compilé (grande zone, 16 777 216 pixels)"
        large: true
        lignes:
          - ["Lot de 4, sans compilation", "225 162 pixels différents", "1,3 % ; écart maximal de 1 niveau sur 255"]
          - ["Lot de 8, sans compilation", "225 414 pixels différents", "1,3 % ; écart maximal de 1 niveau sur 255"]
          - ["Lot de 8, fils de lecture et cache", "225 414 pixels différents", "le même compte que la ligne précédente, tranche par tranche"]
        note: >-
          Comme dans X-004 : des écarts d'un seul niveau, répartis sur toute l'image. Les fils de
          lecture et le cache ne changent pas un pixel par rapport au lot de 8 seul.
      - genre: journal
        titre: "Le tableau de fin"
        large: true
        texte: |
          lot4-compile : 1122 blocs en 154 s, 4386 blocs en 224 s ; débit 46.8 blocs/s ; démarrage 130 s ; pic de mémoire vidéo 4151 Mo
          lot4-sans-compilation : 1122 blocs en 86 s, 4386 blocs en 230 s ; débit 22.7 blocs/s ; démarrage 37 s ; pic de mémoire vidéo 4391 Mo
          lot8-sans-compilation : 1122 blocs en 70 s, 4386 blocs en 238 s ; débit 19.5 blocs/s ; démarrage 13 s ; pic de mémoire vidéo 6707 Mo
          lot8-fils-et-cache : 1122 blocs en 71 s, 4386 blocs en 239 s ; débit 19.4 blocs/s ; démarrage 13 s ; pic de mémoire vidéo 6707 Mo
      - genre: fichiers
        titre: "Ce qui a été écrit"
        lieu: "~/vesuvius/villa/vesuvius/predictions/essai-reglages, dans Ubuntu, hors du dépôt"
        elements:
          - nom: "mesures.tsv"
            taille: "8 lignes"
            role: "Réglage, zone, nombre de blocs, secondes, pic de mémoire vidéo, code de sortie."
          - nom: "<réglage>-<zone>/assemblee.tif"
            taille: "2 048 × 2 048 ou 2 048 × 8 192"
            role: "L'image prédite par chaque réglage. Valeur moyenne 142 sur 255 sur la grande zone ; pas regardée."

    limites: |
      - Le premier réglage mesuré, le nôtre, a payé seul la première lecture du volume : son débit et son démarrage ne sont pas comparables aux autres. X-006 corrige cela.
      - Une seule passe par mesure : pas de répétition, donc pas de marge d'erreur. Seuls les grands écarts compteront.
      - Les premières lectures du volume profitent aux suivantes (le système garde les fichiers en mémoire) : le réglage mesuré en premier, le nôtre, est défavorisé sur la lecture.
      - Le pic de mémoire vidéo comprend ce que Windows occupe déjà.
      - Rien sur l'entraînement : les processus de chargement et la mesure intégrée viendront dans une autre exécution.
      - Rien sur la qualité : les quatre réglages doivent rendre la même image, c'est ce que vérifie la comparaison.

    credits:
      - github: ScrollPrize
        nom: "ScrollPrize/villa"
        lien: https://github.com/ScrollPrize/villa/tree/2d3fb38d33a18b257230c0bd23986436c3d4722e
        licence: MIT
        quoi: >-
          Le programme de prédiction et toutes les options comparées ici : le paquet `vesuvius` de
          villa, au commit `2d3fb38`. Nous n'avons écrit que la mesure.
        personnes:            # lignes par personne au commit 2d3fb38 (scripts/wsl/auteurs-villa.sh)
          - { github: erdpx, nom: "elian rafael", part: "1 355 lignes de infer.py" }
          - { github: teddywasserman, nom: "Teddy", part: "269 lignes de infer.py" }
          - { github: RhudeJJJJ, nom: "RhudeJJJJ", part: "92 lignes de infer.py" }
          - { github: bnleft, nom: "Bryant Le", part: "22 lignes de infer.py" }
      - github: gomyway
        nom: "gomyway, proposition villa 2428"
        lien: https://github.com/ScrollPrize/villa/pull/2428
        licence: MIT
        quoi: >-
          L'idée de comparer ces réglages et les chiffres de référence, mesurés sur une RTX 4090
          avec un autre modèle.

  - id: X-006
    titre: "Réglages de prédiction, seconde passe : le volume déjà lu"
    date: 2026-11-16
    statut: terminee
    piste: P-420
    taches: [T-015]
    resume: >-
      X-005 a mesuré quatre réglages l'un après l'autre. Le premier a payé la première lecture du
      volume sur le disque, les suivants non : ses chiffres ne sont pas comparables aux autres.
      Cette seconde passe refait les huit mesures à l'identique, une fois le volume déjà lu.

    bilan:
      - question: "Le type de résultat"
        valeur: "Les mêmes durées, à armes égales"
        detail: >-
          Les huit mesures de X-005, refaites dans le même ordre. Les deux passes côte à côte
          disent aussi de combien une mesure bouge d'une fois sur l'autre.
      - question: "La représentativité"
        valeur: "La même zone, 1 % du segment"
        detail: >-
          Une prédiction entière lit surtout du volume jamais lu : la seconde passe mesure le
          calcul, pas la lecture du disque.
      - question: "Ce que cela doit décider"
        valeur: "Rien à changer pour les longues prédictions"
        detail: >-
          Sur la grande zone, les quatre réglages finissent en 254,5 à 256,1 s : moins de 1 %
          d'écart. Le réglage compilé calcule plus vite une fois lancé (25,6 blocs par seconde
          contre 17,7 à 18,5) mais met 85 s à démarrer contre 8 à 19 s. Nous gardons donc notre
          réglage pour une prédiction entière, et `--no-compile` pour les petits essais, où il
          fait gagner environ une minute. Le lot de 8 n'apporte rien et prend 2,6 Go de mémoire
          vidéo de plus.

    code:
      - titre: "La seconde passe"
        fichier: experiments/2026-11-16-reglages-de-prediction/controle.sh
        langage: bash
        extrait: [14, 19]
        notes:
          - lignes: 14
            genre: mesure
            titre: "Les mêmes étapes, rangées à part"
            texte: >-
              `etapes.sh` est relancé tel quel. Le suffixe range les mesures et les images de
              cette passe à côté de celles de la première, sans rien écraser.
          - lignes: [17, 19]
            genre: mesure
            titre: "Deux fois le même réglage : identiques ?"
            texte: >-
              X-005 trouve 1,3 % de pixels différents d'un niveau entre deux réglages. Si deux
              passes du même réglage diffèrent autant, cet écart ne vient pas des réglages.
            fiches: [K-14]

    sorties:
      - genre: mesures
        titre: "Seconde passe : les huit mesures, volume déjà lu"
        large: true
        lignes:
          - ["Lot de 4, compilé", "128,5 s puis 256,1 s", "25,6 blocs/s ; démarrage 85 s ; pic 4 151 Mo"]
          - ["Lot de 4, sans compilation", "76,8 s puis 254,5 s", "18,4 blocs/s ; démarrage 16 s ; pic 4 500 Mo"]
          - ["Lot de 8, sans compilation", "70,9 s puis 254,9 s", "17,7 blocs/s ; démarrage 8 s ; pic 6 813 Mo"]
          - ["Lot de 8, fils de lecture et cache", "79,3 s puis 255,9 s", "18,5 blocs/s ; démarrage 19 s ; pic 6 787 Mo"]
        note: >-
          Petite zone (1 122 blocs) puis grande zone (4 386 blocs). Débit et démarrage sont
          calculés entre les deux, sans marge d'erreur.
      - genre: mesures
        titre: "D'une passe à l'autre : de combien une mesure bouge"
        large: true
        lignes:
          - ["Grande zone, lot de 4 compilé", "223,5 s puis 256,1 s", "+15 %"]
          - ["Grande zone, lot de 4 sans compilation", "230,1 s puis 254,5 s", "+11 %"]
          - ["Grande zone, lot de 8 sans compilation", "238,1 s puis 254,9 s", "+7 %"]
          - ["Grande zone, lot de 8, fils et cache", "239,3 s puis 255,9 s", "+7 %"]
          - ["Même réglage, deux passes : pixels différents", "147 358 sur 16 777 216", "0,9 % ; écart maximal de 1 niveau sur 255"]
          - ["Deux réglages différents : pixels différents", "225 410 à 225 776", "1,3 % ; écart maximal de 1 niveau sur 255"]
        note: >-
          La seconde passe est plus lente que la première, de 7 à 15 %, pour une raison non
          établie (la machine avait tourné quarante minutes de plus). Une même mesure bouge donc
          davantage d'une fois sur l'autre que les réglages ne diffèrent entre eux. Et deux
          passes du même réglage ne rendent pas exactement la même image : l'écart d'un niveau
          entre réglages est du même ordre.
      - genre: journal
        titre: "Le tableau de fin, seconde passe"
        large: true
        texte: |
          lot4-compile-passe2 : 1122 blocs en 128 s, 4386 blocs en 256 s ; débit 25.6 blocs/s ; démarrage 85 s ; pic de mémoire vidéo 4151 Mo
          lot4-sans-compilation-passe2 : 1122 blocs en 77 s, 4386 blocs en 254 s ; débit 18.4 blocs/s ; démarrage 16 s ; pic de mémoire vidéo 4500 Mo
          lot8-sans-compilation-passe2 : 1122 blocs en 71 s, 4386 blocs en 255 s ; débit 17.7 blocs/s ; démarrage 8 s ; pic de mémoire vidéo 6813 Mo
          lot8-fils-et-cache-passe2 : 1122 blocs en 79 s, 4386 blocs en 256 s ; débit 18.5 blocs/s ; démarrage 19 s ; pic de mémoire vidéo 6787 Mo
          --- lot4-compile, première passe contre seconde passe (grande zone)
          pixels différents : 147358 sur 16777216 ; écart maximal : 1 sur 255

    limites: |
      - Le débit du réglage compilé (25,6 blocs par seconde) ne se retrouve pas dans X-003, qui a tenu 17,3 blocs par seconde sur cinq heures avec ce même réglage. Sur un volume jamais lu, la lecture du disque pèse sans doute plus que le calcul : non mesuré.
      - Les fils de lecture et le cache n'ont été essayés que sur un volume déjà lu, là où ils ont le moins à apporter.
      - Deux passes ne font pas une statistique : elles donnent un ordre de grandeur du bruit.
      - Le volume déjà lu n'est pas la situation d'une prédiction entière.
      - Rien sur l'entraînement ni sur la qualité.

    credits:
      - github: ScrollPrize
        nom: "ScrollPrize/villa"
        lien: https://github.com/ScrollPrize/villa/tree/2d3fb38d33a18b257230c0bd23986436c3d4722e
        licence: MIT
        quoi: >-
          Le programme de prédiction et toutes les options comparées : le paquet `vesuvius` de
          villa, au commit `2d3fb38`.
