# Rendu d'exécution de cette expérience, montré dans l'onglet « Exécutions » de l'IHM.
# Format : pilotage/README.md. Page écrite avant le lancement, complétée après (2026-11-16).
executions:
  - id: X-007
    titre: "Entraînement : plus de processus de chargement, est-ce plus rapide ?"
    date: 2026-11-16
    statut: terminee
    piste: P-420
    taches: [T-015]
    resume: >-
      Second volet du premier point de l'ordre d'essai. Le même court entraînement, 350
      itérations, avec 1, 2 puis 4 processus de chargement des données, et la mesure intégrée de
      villa pour savoir quelle part de chaque itération se passe à attendre les données.

    bilan:
      - question: "Le type de résultat"
        valeur: "Un temps par itération, et la part d'attente des données"
        detail: >-
          Pour chaque variante : la durée d'une itération, mesurée sur 300 itérations après 50
          d'échauffement, et ce que le programme a passé à attendre ses blocs. Aucun modèle utile
          n'en sort : 350 itérations sur 20 000.
      - question: "La représentativité"
        valeur: "Le réglage de X-002, sur moins de 2 % de sa durée"
        detail: >-
          Mêmes blocs de 128, même lot de 2, même segment. X-002 a tenu 20 000 itérations en
          1 h 53, soit 0,34 s par itération avec un seul processus.
      - question: "Ce que cela doit décider"
        valeur: "Le nombre de processus du prochain entraînement"
        detail: >-
          Si l'attente des données est déjà proche de zéro avec un processus, en ajouter ne peut
          rien apporter, et le temps part dans le calcul. Sinon, la variante la plus rapide qui
          tient dans nos 6,8 Go de mémoire vive devient le réglage. Réponse mesurée : l'attente
          est d'un millième de seconde par itération dans les quatre passes. Le temps part dans
          le calcul ; nous restons à un processus.
        fiches: [K-10]

    code:
      - titre: "Le réglage, identique à X-002 sauf trois lignes"
        fichier: experiments/2026-11-16-reglages-d-entrainement/essai-chargement.json
        langage: json
        extrait: [15, 20]
        notes:
          - lignes: 16
            genre: mesure
            titre: "350 itérations"
            texte: "Assez pour une moyenne, pas pour apprendre quoi que ce soit."
          - lignes: 19
            genre: optimisation
            titre: "Le levier essayé"
            texte: >-
              Le nombre de processus qui préparent les blocs pendant que la carte graphique
              calcule. Le script le remplace par 1, 2 ou 4.
            fiches: [K-10]
          - lignes: 20
            genre: mesure
            titre: "La mesure intégrée de villa"
            texte: >-
              Activée, elle laisse passer 50 itérations d'échauffement puis chronomètre les
              suivantes, en comptant à part le temps passé à attendre les données. Le résultat
              est écrit dans `benchmark_summary.json`.

      - titre: "Les quatre passes"
        fichier: experiments/2026-11-16-reglages-d-entrainement/etapes.sh
        langage: bash
        extrait: [10, 32]
        notes:
          - lignes: 11
            genre: mesure
            titre: "Un processus, deux fois"
            texte: >-
              La première variante est refaite à la fin. X-005 nous l'a appris : la mesure faite
              en premier paie la première lecture du disque. L'écart entre les deux passes à un
              processus dit de combien une mesure bouge, et donc quels écarts comptent.
          - lignes: [23, 24]
            genre: donnees
            titre: "La liste des blocs, reprise de X-002"
            texte: >-
              Repérer les blocs étiquetés prend du temps et de la mémoire au démarrage. La liste
              est la même que pour X-002 : on la recopie.
          - lignes: [28, 30]
            genre: parametrage
            titre: "La commande d'entraînement du tutoriel, sous une limite de 25 minutes"
            texte: >-
              Quatre processus chargent chacun leurs données : la mémoire vive peut manquer. La
              limite et le code de sortie disent si une variante n'a pas tenu.

    sorties:
      - genre: mesures
        titre: "Les quatre passes, dans l'ordre où elles ont tourné"
        large: true
        lignes:
          - ["1 processus", "0,373 s par itération", "dont 0,001 s à attendre les données ; 153 s en tout"]
          - ["2 processus", "0,342 s par itération", "dont 0,001 s à attendre les données ; 144 s en tout"]
          - ["4 processus", "0,369 s par itération", "dont 0,001 s à attendre les données ; 156 s en tout"]
          - ["1 processus, seconde passe", "0,364 s par itération", "dont 0,001 s à attendre les données ; 150 s en tout"]
        note: >-
          300 itérations mesurées par passe, après 50 d'échauffement. Les deux passes à un
          processus diffèrent de 2,5 %. Deux processus sortent 6 à 8 % plus vite, sur une seule
          passe : trop peu pour conclure, et l'attente des données, déjà nulle, ne peut pas
          l'expliquer.
      - genre: mesures
        titre: "Mémoire"
        lignes:
          - ["Mémoire vidéo allouée par l'entraînement, pic", "3 621 Mo", "le même dans les quatre passes ; 4 244 Mo réservés"]
          - ["Mémoire vidéo de la carte, pic relevé par le lanceur", "6 049 Mo", "sur 8 192, avec ce que Windows occupe"]
          - ["Mémoire vive après chaque passe", "678 à 688 Mo utilisés", "aucune mémoire d'appoint utilisée ; quatre processus ont tenu"]
      - genre: journal
        titre: "Le tableau de fin"
        large: true
        texte: |
          un (1 processus) : 300 itérations mesurées ; 0.373 s par itération, dont 0.001 s à attendre les données (0 %) ; pic alloué 3621 Mo, réservé 4244 Mo
          deux (2 processus) : 300 itérations mesurées ; 0.342 s par itération, dont 0.001 s à attendre les données (0 %) ; pic alloué 3621 Mo, réservé 4244 Mo
          quatre (4 processus) : 300 itérations mesurées ; 0.369 s par itération, dont 0.001 s à attendre les données (0 %) ; pic alloué 3621 Mo, réservé 4244 Mo
          un-bis (1 processus) : 300 itérations mesurées ; 0.364 s par itération, dont 0.001 s à attendre les données (0 %) ; pic alloué 3621 Mo, réservé 4244 Mo
      - genre: fichiers
        titre: "Ce qui a été écrit"
        lieu: "~/vesuvius/villa/vesuvius/runs, dans Ubuntu, hors du dépôt"
        elements:
          - nom: "essai_chargement_<variante>/benchmark_summary.json"
            taille: "4 fichiers"
            role: "Le résumé écrit par la mesure intégrée de villa. Aucun point de sauvegarde n'est gardé."

    limites: |
      - La mémoire vive n'a été relevée qu'après chaque passe, pas pendant : son pic avec quatre processus n'est pas connu.
      - 300 itérations mesurées par variante, une seule passe sauf pour un processus.
      - Rien sur la qualité du modèle, ni sur un entraînement de deux heures : la mémoire vive peut grossir avec le temps.
      - Le pic de mémoire vidéo relevé par villa ne compte que ce que l'entraînement alloue, pas ce que Windows occupe.
      - Les blocs de 256 et l'accumulation de gradient sont un autre essai (point 3 de l'ordre).

