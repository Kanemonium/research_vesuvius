        nom: "LynnHenry, proposition villa 2298"
        lien: https://github.com/ScrollPrize/villa/pull/2298
        quoi: >-
          Le réglage essayé (blocs de 256, lot de 1, deux lots cumulés) et le chiffre de
          comparaison sur une RTX 3080 de 10 Go sous WSL2. Seule la description de la proposition
          sert ici ; son code n'est pas repris.
