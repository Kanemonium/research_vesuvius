        nom: "Hyojun Kwon, harnais de validation"
        lien: https://github.com/khj1222/vesuvius-challenge/tree/c876e018944f6d6546b11daab8f9d00f48bddbbd
        licence: MIT
        quoi: >-
          Les outils `tools/sweep_checkpoints.py` et `tools/eval_validation.py`, lancés depuis une
