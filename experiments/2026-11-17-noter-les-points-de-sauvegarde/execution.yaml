    limites: |
      - Un seul découpage, une seule graine : pas de marge d'erreur mesurée chez nous. Le seuil de bruit de 0,03 est celui de l'auteur des outils, pas le nôtre.
      - Les trois derniers points (18 000, 19 000, 20 000) et celui de villa tiennent dans ce seuil : 19 000 est gardé par convention, pas parce qu'il est prouvé meilleur.
      - La courbe monte encore à la fin : l'entraînement n'a peut-être pas donné tout ce qu'il pouvait en 20 000 itérations. Non vérifié.
      - Le seuil qui donne le meilleur F1 est choisi sur les régions mêmes qui servent à noter : le chiffre est un peu flatteur.
      - Rien sur ce que le modèle répond hors des régions étiquetées.
      - Aucune comparaison avec X-002, qui a vu ces régions pendant son entraînement.
      - Pourquoi le fichier gardé par villa (17 500) note comme l'itération 18 000 à 0,0001 près : non expliqué. Les deux fichiers sont différents.
      - Pourquoi le modèle répond « encre » presque partout jusqu'à l'itération 10 000 : toujours non expliqué.
      - Les deux aperçus sont regardés à l'œil, sur deux régions et un seul point de sauvegarde.

