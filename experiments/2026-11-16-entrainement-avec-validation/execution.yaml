    limites: |
      - Le modèle apprend sur 20 % d'étiquettes en moins que X-002 : il n'est pas attendu meilleur, il est attendu mesurable. Les deux ne sont pas comparés ici.
      - Chaque note porte sur cinquante lots tirés au hasard, pas les mêmes d'une fois à l'autre : deux notes voisines diffèrent jusqu'à 0,11. Le « meilleur » point de sauvegarde est donc incertain.
      - Aucun F1, aucun seuil balayé, aucune image d'encre des régions mises de côté : c'est la dernière étape de T-016.
      - Pourquoi le modèle répond « encre » partout sur ces régions pendant la première moitié de l'entraînement : non expliqué.
      - Un seul découpage, une seule graine : pas de marge d'erreur mesurée chez nous.
      - Les images des régions mises de côté restent visibles par les blocs voisins ; seules leurs étiquettes sont retirées.
      - Le dossier de sortie occupe 16 Go ; il reste 23 Go libres sur le disque (96 % occupé) après l'exécution.

