          - ["Justesse équilibrée", "0,816", "moyenne des deux lignes suivantes"]
          - ["Encre retrouvée", "89,8 %", "273 911 pixels d'encre sur 305 172"]
          - ["Fond reconnu", "73,5 %", "927 565 pixels de fond sur 1 261 392"]
          - ["Part d'encre vraie dans ce que le modèle appelle encre", "45,1 %", "273 911 sur 607 738 : il en voit encore trop"]
          - ["Dernière note, itération 19 500", "0,776", "encre retrouvée 81,0 %, fond reconnu 74,3 %"]
        note: >-
          Calculé à partir des comptes de pixels que villa écrit dans validation_metrics.jsonl,
          sur cinquante lots de deux blocs. Le seuil qui sépare encre et fond est celui de villa ;
          nous ne l'avons pas relevé. La dernière itération n'est pas notée : la note tombe aux
          multiples de 500 avant 20 000.
