      - Une prédiction sur ce même segment montrera ce que le modèle a retenu, pas ce qu'il sait reconnaître ailleurs.
      - L'effet des blocs de 128 sur la qualité, par rapport aux blocs de 256 de la recette, n'est pas mesuré.
      - L'optimiseur, la perte et le planificateur sont ceux de villa par défaut ; aucun n'a été réglé.

