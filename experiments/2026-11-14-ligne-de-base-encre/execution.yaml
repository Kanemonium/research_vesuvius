        note: >-
          Extrait. `num_stages: 6` et `features_per_stage` décrivent les six étages du U (K-11) ;
          `pooling factors [16 32 32]` dit de combien le bloc est réduit au fond du U : 16 fois en
          profondeur, 32 fois en largeur et en hauteur.

    limites: |
