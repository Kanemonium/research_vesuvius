  # ------------------------------------------------------------------------------------------
  # Page écrite AVANT le lancement (2026-11-15). Les sorties seront ajoutées une fois l'exécution terminée.
  - id: X-003
    titre: "Première prédiction d'encre sur le segment du tutoriel"
    date: 2026-11-15
    statut: terminee
    piste: P-310
    taches: [T-005]
    resume: >-
      Le modèle entraîné dans X-002 a parcouru tout le segment w00_20231016151002, en 16 bandes,
      en 5 h 34 min. Il en sort une image d'encre de 32 249 × 51 380 pixels, où des formes claires
      alignées en rangées apparaissent dans la moitié haute. Ce n'est pas une lecture, et pas encore
      une preuve : ce segment a servi à l'entraînement.

    bilan:
      - question: "Le type de résultat"
        valeur: "Une image d'encre, avec des formes de lettres"
        detail: >-
          Un fichier TIFF de 32 249 × 51 380 pixels, 1,66 Go, resté sur la machine. Sur un aperçu
          réduit seize fois, on voit dans la moitié haute des formes claires, de la taille de
          lettres, alignées sur cinq ou six rangées, et une colonne de formes semblables au bord
          gauche. Le reste montre surtout la trame des fibres du papyrus. À pleine résolution, un
          extrait pris au centre ne montre que cette trame. Nous n'avons identifié aucune lettre :
          cela revient à des papyrologues.
        fiches: [K-08]
      - question: "La représentativité"
        valeur: "Il ne récite pas seulement, mais il tranche mal"
        detail: >-
          Comparée aux étiquettes du segment, l'image montre deux choses. D'abord, des formes de
          lettres apparaissent aussi hors de la zone étiquetée, qui ne couvre que 5,8 % de l'image :
          sur les mêmes rangées, entre les zones corrigées, et le long du bord gauche. Le modèle ne
          fait donc pas que rendre son corrigé. Ensuite, il sépare mal l'encre du fond, même là où il
          a eu le corrigé : sur l'encre étiquetée sa réponse médiane est 201 sur 255, sur le fond
          étiqueté elle est encore de 129. Tout cela reste dans la même feuille que l'entraînement :
          cela ne dit rien d'un autre rouleau, et aucune lettre n'est identifiée.
        fiches: [K-16, K-21, K-26]
      - question: "Le niveau d'optimisation"
        valeur: "5 h 34 min, 17 blocs par seconde"
        detail: >-
          346 481 blocs en 20 072 secondes, démarrages compris. Pic de mémoire vidéo : 4 870 Mo sur
          8 192. Aucune reprise n'a été nécessaire. Rien n'a été optimisé : un seul processus de
          chargement, lot de 4. Trois propositions publiques visent ce temps ; aucune n'est essayée
          chez nous.
        fiches: [K-12]

    code:
      - titre: "La commande de prédiction"
        fichier: experiments/2026-11-14-ligne-de-base-encre/predire.sh
        langage: bash
        extrait: [7, 19]
        intro: >-
          C'est la prédiction du tutoriel, découpée en bandes pour pouvoir être arrêtée et reprise
          (X-004), et passée par notre lanceur pour être suivie dans cette page.
        notes:
          - lignes: 9
            genre: optimisation
            titre: "La mémoire d'appoint, par précaution"
            texte: >-
              L'entraînement avait été tué faute de mémoire vive avant qu'on ajoute 12 Go de
              fichier d'échange. Nous ne savons pas si la prédiction en a besoin ; elle est
              réactivée dans le doute.
          - lignes: 13
            genre: mesure
            titre: "Le lanceur qui rend l'exécution suivable"
            texte: >-
              `lancer-execution.sh` note l'heure de début, écrit tout ce que le programme affiche
              dans un journal, relève le pic de mémoire vidéo toutes les deux secondes, puis note
              la fin et le code de sortie. La barre de progression et le journal de cette page
              viennent de là. `HAUTEUR_BANDE=2048` : 16 bandes de 2 048 lignes ; un arrêt ne fait
              perdre que la bande en cours, et relancer la commande reprend à la première manquante.
          - lignes: 14
            genre: optimisation
            titre: "Le découpage en bandes"
            texte: >-
              Le programme de villa ne sait pas reprendre une prédiction arrêtée. `predire-par-bandes.sh`
              lui confie une bande à la fois, garde celles qui sont finies, et assemble le tout.
              Vérifié dans X-004 : l'image assemblée ne s'écarte de l'image d'un seul tenant que
              d'un niveau sur 255 au plus, sur 0,9 % des pixels.
          - lignes: 15
            genre: donnees
            titre: "L'entrée : le volume de surface"
            texte: >-
              Le fichier `.zarr` du segment, lu à son niveau le plus fin : 63 Go sur le disque.
              Contrairement à l'entraînement, qui ne lisait que les zones étiquetées, la
              prédiction parcourt tout le segment.
            fiches: [K-07, K-10]
          - lignes: 16
            genre: parametrage
            titre: "Le modèle : le dernier point de sauvegarde"
            texte: >-
              `ckpt_020000.pth`, écrit à la fin de X-002. Le tutoriel indique qu'on peut aussi
              lancer la prédiction sur un point intermédiaire pour voir le modèle progresser.
            fiches: [K-15]
          - lignes: 17
            genre: donnees
            titre: "La sortie : un dossier de bandes, puis une image"
            texte: >-
              Une image TIFF par bande, puis l'image assemblée, dans le dossier de villa, dans
              Ubuntu, hors du dépôt.
          - lignes: 18
            genre: parametrage
            titre: "Des fenêtres qui se chevauchent"
            texte: >-
              Le modèle glisse sur le segment bloc par bloc, chaque bloc recouvrant le précédent
              de moitié, puis les réponses qui se chevauchent sont fondues ensemble (`hann`). Ce
              sont les valeurs par défaut de villa, écrites ici pour que la commande reste
              reproductible.
            fiches: [K-12]
          - lignes: 19
            genre: optimisation
            titre: "Quatre blocs à la fois"
            texte: >-
              La valeur du tutoriel. Mesurée dans X-004 : 4 869 Mo de mémoire vidéo, la carte
              tient. Un seul processus de chargement, pour ménager la mémoire vive ; son effet sur
              la vitesse n'est pas mesuré.

      - titre: "Comparer l'image aux étiquettes"
        fichier: scripts/wsl/comparer_aux_etiquettes.py
        langage: python
        extrait: [53, 67]
        intro: >-
          Lancé après la prédiction. Il lit l'image d'encre, les étiquettes et le masque de
          supervision par tranches de 1 024 lignes, pour ne jamais tenir les trois en mémoire.
        notes:
          - lignes: [55, 56]
            genre: donnees
            titre: "Les deux corrigés"
            texte: >-
              Les étiquettes disent où est l'encre ; le masque de supervision dit où ces étiquettes
              sont fiables. Hors du masque, l'entraînement n'a rien vu de corrigé.
            fiches: [K-09, K-19]
          - lignes: [59, 60]
            genre: mesure
            titre: "Trois zones"
            texte: >-
              Encre étiquetée, fond étiqueté, et papyrus jamais corrigé (hors masque, hors zones
              vides). Pour chacune, on compte combien de pixels prennent chaque valeur de 0 à 255.
            fiches: [K-16]
          - lignes: [61, 64]
            genre: mesure
            titre: "L'accord au seuil du milieu"
            texte: >-
              On appelle « marqué » un pixel à 128 ou plus, et on compte les accords et les
              désaccords avec les étiquettes, dans la zone de supervision seulement. Le score Dice
              en sort.
            fiches: [K-26]

    sorties:
      - genre: image
        titre: "L'image d'encre, réduite seize fois"
        large: true
        fichier: X-003.png
        alt: "Une feuille de papyrus grise, avec des formes claires alignées en rangées dans la moitié haute"
        legende: >-
          Chaque pixel est la moyenne d'un carré de 16 pixels de l'image d'origine. Plus c'est clair,
          plus le modèle estime qu'il y a de l'encre. La trame croisée est celle des fibres du papyrus.
      - genre: image
        titre: "Où le modèle avait le corrigé"
        fichier: X-003-zones.png
        alt: "La même image, avec des zones teintées en bleu et des lettres en orange"
        legende: >-
          En bleu, la zone de supervision : le seul endroit où l'entraînement a vu un corrigé.
          En orange, l'encre étiquetée. Les étiquettes sont celles publiées avec le tutoriel.
      - genre: image
        titre: "Ce qu'il dit là où il n'a jamais été corrigé"
        fichier: X-003-hors-etiquettes.png
        alt: "La même image, zone de supervision noircie : des formes claires restent visibles autour"
        legende: >-
          La zone de supervision est noircie. Les formes claires qui restent sont sur du papyrus
          que le modèle n'a jamais vu corrigé.
      - genre: mesures
        titre: "La prédiction, zone par zone"
        large: true
        lignes:
          - ["Encre étiquetée (1,3 % de l'image)", "médiane 201 sur 255", "90,6 % des pixels à 128 ou plus ; 57,4 % à 192 ou plus"]
          - ["Fond étiqueté (4,5 %)", "médiane 129", "51,1 % à 128 ou plus ; 8,2 % à 192 ou plus"]
          - ["Papyrus jamais corrigé (77,6 %)", "médiane 141", "61,0 % à 128 ou plus ; 12,9 % à 192 ou plus"]
          - ["Zones vides (16,6 %)", "0", "sautées par villa"]
          - ["Accord avec les étiquettes, seuil 128", "Dice 0,50", "rappel 0,91, précision 0,34 ; zone de supervision seulement"]
          - ["Où sont les pixels très clairs", "90 % hors de la zone étiquetée", "elle ne couvre que 5,8 % de l'image"]
        note: >-
          Le fond étiqueté devrait être sombre : le modèle a appris qu'il n'y a pas d'encre là. Sa
          médiane est pourtant de 129, au milieu de l'échelle. Au seuil du milieu, deux pixels
          marqués sur trois sont du fond : d'où la précision de 0,34. Ce Dice est mesuré sur la zone
          d'entraînement, pas sur une zone tenue à l'écart : il ne vaut pas note de qualité (K-26).
      - genre: mesures
        titre: "L'exécution"
        large: true
        lignes:
          - ["Durée totale", "5 h 34 min 32 s", "de 12:59:50 à 18:34:22, assemblage compris"]
          - ["Bandes", "16 sur 16", "aucune reprise, aucune erreur ; code de sortie 0"]
          - ["Blocs prédits", "346 481", "l'estimation d'avant lancement était de 333 000"]
          - ["Vitesse d'ensemble", "17,3 blocs par seconde", "démarrage de chaque bande compris"]
          - ["Une bande pleine", "19 à 29 minutes", "22 700 à 24 400 blocs ; la première et la dernière, partielles, 8 et 9 minutes"]
          - ["Pic de mémoire vidéo", "4 870 Mo", "sur 8 192 ; 4 869 Mo dans X-004"]
          - ["Part du segment non vide", "82,2 %", "annoncée par le programme de villa à chaque bande"]
      - genre: mesures
        titre: "L'image"
        large: true
        lignes:
          - ["Taille", "32 249 × 51 380 pixels", "1,66 Go, un octet par pixel"]
          - ["Pixels à zéro", "16,6 %", "les zones vides, que villa saute"]
          - ["Valeur moyenne", "118 sur 255", "141 hors zones vides"]
          - ["Valeur médiane", "129", "un quart des pixels sous 86, un quart au-dessus de 166"]
          - ["Pixels très clairs (192 et plus)", "11,1 %", ""]
        note: >-
          L'image est grise presque partout : la moitié des pixels dépasse 128. Le modèle ne répond
          donc pas « encre » ou « pas d'encre » de façon tranchée. Une cause possible, non vérifiée :
          l'entraînement adoucit ses cibles (K-13), ce qui resserre les réponses vers le milieu.
          Le tutoriel le dit lui-même et propose de réétaler l'image pour l'afficher.
      - genre: fichiers
        titre: "Ce qui a été écrit"
        lieu: "~/vesuvius/villa/vesuvius/predictions/w00_20231016151002, dans Ubuntu, hors du dépôt"
        elements:
          - nom: "assemblee.tif"
            taille: "1,66 Go"
            role: "L'image d'encre entière."
          - nom: "bande-….tif (16 fichiers)"
            taille: "environ 1,2 Go en tout"
            role: "Les bandes, avec leur témoin « fait » : relancer la commande ne recalcule rien."
          - nom: "local/apercus/X-003.png et X-003-extrait.png"
            taille: "2 015 × 3 211"
            role: "Un aperçu réduit seize fois et un extrait à pleine résolution, dans le dossier local ignoré par git."

    limites: |
      - Une image où des formes de lettres apparaissent n'est pas une lecture : seuls des papyrologues peuvent valider un texte. Nous n'avons identifié aucune lettre.
      - Les formes visibles hors de la zone étiquetée sont dans la même feuille que l'entraînement, souvent sur les mêmes rangées : le modèle n'a pas vu leur corrigé, mais ce n'est pas une zone de validation choisie à l'avance.
      - Les chiffres zone par zone sont mesurés sur le segment d'entraînement : aucun n'est une note de qualité.
      - Le modèle sépare mal l'encre du fond. Le tutoriel l'annonce en partie, à propos de ses modèles partagés : avec des cibles adoucies (0,25 pour le fond, 0,75 pour l'encre), le fond ne tombe pas à zéro. Nous n'avons pas vérifié que notre entraînement utilise le même réglage. Cela explique l'encre à 201 sur 255, proche de 0,75. Cela n'explique pas le fond à 129, soit 0,51 au lieu de 0,25 : cet écart reste sans cause établie.
      - Les images montrées sont réduites seize fois. Elles restent sur la machine, hors du dépôt.

