          sampling_audit={"patches": 8098, "strategy": "uniform"}
          Using 3D convolutions (nn.Conv3d)
          Using 3D normalization (nn.InstanceNorm3d)
          Patch size adjusted from (64, 128, 128) to (64, 128, 128) to ensure divisibility by pooling factors [16 32 32]
          Task 'ink' configured with z-projection mode 'max'
          NetworkFromConfig initialized with final configuration:
            basic_encoder_block: BasicBlockD
