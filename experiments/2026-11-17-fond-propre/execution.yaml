          supervision, puis réentraîner sous une nouvelle version d'étiquettes.
        personnes:            # lignes par personne au commit 2d3fb38 (scripts/wsl/auteurs-villa.sh)
          - { github: erdpx, nom: "elian rafael", part: "1 122 lignes de train.py" }
