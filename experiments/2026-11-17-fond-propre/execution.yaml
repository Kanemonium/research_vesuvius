# Rendu d'exécution de cette expérience, montré dans l'onglet « Exécutions » de l'IHM.
# Format : pilotage/README.md. Page écrite avant le lancement, complétée à la fin (2026-11-17).
executions:
  - id: X-011
    titre: "Où prendre du fond propre ? Seize carrés à faire juger"
    date: 2026-11-17
    statut: terminee
    piste: P-310
    taches: [T-020]
    resume: >-
      Première étape du quatrième point de l'ordre d'essai. Avant d'apprendre au modèle ce
      qu'est du papyrus vierge, il faut en désigner. Ce script propose seize carrés loin de toute
      annotation ; c'est Kanemonium qui dira lesquels sont vierges.
      Résultat : les seize carrés sont proposés, le choix reste à faire.

    bilan:
      - question: "Le type de résultat"
        valeur: "Seize carrés proposés sur 957 possibles"
        detail: >-
          Pour chaque carré de 1 024 pixels : le papyrus tel que le scan le montre, à côté de ce
          que le modèle de X-002 y répond (la carte de X-003). Aucun entraînement, aucune
          prédiction : le script relit ce qui existe.
        fiches: [K-07, K-08]
      - question: "La représentativité"
        valeur: "Un tri automatique, qui ne sait pas reconnaître une lettre"
        detail: >-
          Deux familles. A : les carrés où le modèle voit le moins d'encre, donc les plus
          probablement vierges, mais aussi ceux qui lui apprendront le moins. B : les carrés
          d'un gris moyen et uniforme, le « fond gris » que l'on veut corriger, mais où une
          encre pâle pourrait se cacher.
        fiches: [K-21]
      - question: "Ce que cela doit décider"
        valeur: "Quels carrés entrent dans la zone de supervision comme fond"
        detail: >-
          Un carré déclaré vierge à tort apprendrait au modèle à effacer de l'encre : dans le
          doute, un carré est écarté. Deux ou trois carrés jugés vierges seront gardés hors de
          l'entraînement, comme contrôle.
        fiches: [K-16, K-09]

    code:
      - titre: "Le tri des carrés"
        fichier: experiments/2026-11-17-fond-propre/candidats.py
        langage: python
        extrait: [74, 98]
        notes:
          - lignes: 74
            genre: mesure
            titre: "La distance à l'annotation la plus proche"
            texte: "Calculée sur l'image réduite huit fois, puis ramenée en pixels du segment."
          - lignes: 82
            genre: donnees
            titre: "Deux raisons d'écarter un carré"
            texte: >-
              Il touche une zone vide du segment, ou il est à moins de 512 pixels d'une
              annotation : assez loin pour ne pas mordre sur une lettre déjà étiquetée ni sur
              les régions mises de côté.
            fiches: [K-16]
          - lignes: 96
            genre: parametrage
            titre: "Famille A : le moins de pixels très clairs"
            texte: "Très clair veut dire 192 ou plus sur 255 dans la carte de X-003."
          - lignes: [97, 98]
            genre: parametrage
            titre: "Famille B : gris moyen, uniforme"
            texte: >-
              Moyenne entre 120 et 160, et le plus faible écart-type. Deux carrés retenus sont
              toujours séparés d'au moins trois carrés, pour couvrir le segment.

    sorties:
      - genre: image
        titre: "La carte d'ensemble"
        large: true
        fichier: X-011-carte.png
        alt: "La carte d'encre du segment entier en gris, les zones annotées en bleu, et seize petits carrés numérotés, surtout en bas et à droite"
        legende: >-
          La carte de X-003 réduite trente-deux fois. En bleu, la zone de supervision du tutoriel.
          En orange, la famille A (1 à 8) ; en jaune, la famille B (9 à 16). Presque tous les
          carrés tombent dans la bande du bas et sur le bord droit, là où cette carte ne montre
          pas de formes claires alignées. C'est une observation d'Agent C. à l'œil, pas un jugement.
      - genre: image
        titre: "Les seize carrés"
        large: true
        fichier: X-011-candidats.png
        alt: "Seize paires d'images grises : à gauche de chaque paire le papyrus, avec ses fibres et des plages sombres, à droite la carte d'encre du même carré"
        legende: >-
          Pour chaque carré : à gauche la couche du milieu du scan, à droite ce que le modèle de
          X-002 y répond (clair : encre probable). Réduit quatre fois. Les carrés 9, 11 et 14
          touchent le bord du segment.
      - genre: mesures
        titre: "Ce que le tri a trouvé"
        large: true
        lignes:
          - ["Carrés de 1 024 pixels dans le segment", "1 550", ""]
          - ["Sans zone vide et à plus de 512 px d'une annotation", "957", "62 % des carrés"]
          - ["Sur ces 957, réponse moyenne du modèle", "141 sur 255", "médiane des carrés ; 11,1 % de pixels très clairs"]
          - ["Famille A, les huit retenus", "0,9 à 2,3 % de pixels très clairs", "moyenne de 103 à 118"]
          - ["Famille B, les huit retenus", "10,1 à 15,8 % de pixels très clairs", "moyenne de 150 à 160"]
          - ["Part annotée du segment", "5,88 %", "X-003 donnait 5,8 %"]
          - ["Durée", "1 min 16 s", "seconde passe ; la première a duré 1 min 52 s"]
        note: >-
          Très clair veut dire 192 ou plus sur 255. Même dans la famille A, le modèle répond en
          moyenne plus de 100 sur 255 : aucun carré n'est franchement sombre.
      - genre: mesures
        titre: "Les seize carrés, un par un"
        large: true
