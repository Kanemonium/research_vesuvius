          sampling_audit={"patches": 6567, "strategy": "uniform"}
          step,threshold,f1,precision,recall,iou,balanced_accuracy,drd,pseudo_fmeasure,seconds
          17000,186,0.729575,0.761882,0.699897,0.574276,0.817472,,,395.7
