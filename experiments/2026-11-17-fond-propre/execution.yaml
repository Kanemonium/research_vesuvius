      - genre: fichiers
        titre: "Ce qui a été écrit"
        lieu: "~/vesuvius, dans Ubuntu, hors du dépôt"
        elements:
          - nom: "ink-dataset/phercparis4/w00_20231016151002/*_v2.tif et *_v2.zarr"
            taille: "3 fichiers et 3 dossiers"
            role: "Les étiquettes en version 2. Seul le masque de supervision diffère de la version 1."
          - nom: "villa/vesuvius/runs/fond_propre_128/"
            taille: "18 Mo, après suppression"
            role: "Les notes de validation, la liste des blocs et les aperçus. Les vingt et un points de sauvegarde (16 Go), qui valaient ceux de X-008, ont été supprimés le 2026-11-17 avec l'accord de Kanemonium : le chiffre d'après ne peut plus être rejoué sans réentraîner."
          - nom: "villa/vesuvius/runs/fond_propre_128_notes/"
            taille: "136 Mo"
            role: "Les prédictions et les notes des itérations 17 000 à 20 000, et `summary.csv`."
          - nom: "villa/vesuvius/runs/fond_propre_128_carres/"
            taille: "59 Mo"
            role: "Le masque des onze carrés, et les prédictions d'avant et d'après."

    limites: |
      - Les carrés ont été jugés vierges à l'œil, par deux personnes qui ne sont pas papyrologues, sur une couche du scan et la carte d'un modèle : une erreur apprendrait au modèle à effacer de l'encre.
      - Deux carrés de contrôle seulement, choisis dans la même bande du segment que les carrés d'entraînement.
      - Un seul découpage, une seule graine ; le seuil de bruit de 0,03 de F1 est celui de l'auteur des outils.
      - Le F1 ne regarde que le voisinage des lettres : il peut ne pas bouger alors que le fond change, ou l'inverse.
      - L'essai ne dit rien de l'effet du fond propre : aucun bloc n'a été tiré dans les carrés.
      - Nous n'avons pas vérifié, avant de lancer, que les carrés donnaient des blocs. Compter les blocs avant et après aurait suffi, en une minute, sans carte graphique.
      - « Même modèle » est déduit de mesures identiques, pas d'une comparaison des poids.
      - Admettre les blocs sans encre (`patch_min_labeled_coverage` à 0) changera peut-être aussi les blocs tirés dans l'ancienne zone de supervision : non mesuré, à compter avant de relancer.
      - Après cet essai, un réglage sans `label_version` prendra seul la version 2 : les anciens réglages sont à relancer avec `"label_version": "v1"`.

