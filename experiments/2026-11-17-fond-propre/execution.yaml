          - nom: "experiments/2026-11-17-fond-propre/candidats.json"
            taille: "4 ko"
            role: "Les seize carrés et leurs mesures. Des coordonnées, aucune donnée de rouleau."
          - nom: "local/apercus/X-011-candidats.png et X-011-carte.png"
            taille: "1,4 et 1,6 Mo"
            role: "La planche et la carte d'ensemble."

    limites: |
      - Le script ne reconnaît pas l'écriture : il ne fait que trier. Le jugement est humain, et Kanemonium n'est pas papyrologue : un carré douteux est écarté.
      - Le tri s'appuie sur la carte de X-003, donc sur le modèle de X-002 : il hérite de ses erreurs.
      - La planche montre une seule couche du scan, celle du milieu, réduite quatre fois.
      - Seize carrés font 1,0 % du segment : rien ne dit que ce soit assez pour changer le modèle.
      - Le script a été lancé deux fois : la seconde seulement pour grossir les numéros de la carte d'ensemble. Les seize carrés sont les mêmes.
      - Les carrés 9, 11 et 14 touchent le bord du segment : le contrôle des zones vides ne les a pas écartés.
      - Rien n'est mesuré sur l'effet : c'est l'objet de l'entraînement qui suivra.

