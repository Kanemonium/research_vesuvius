      - genre: journal
        titre: "Les lignes qui comptent"
        large: true
        texte: |
          zone de supervision : 95935984 pixels avant, 105373168 après (+9.8 %), soit 6.36 % de l'image
          Processed 6 image(s): 3 written, 3 skipped, 0 failed.
          avant (X-008, itération 19 000) : part des pixels à 176 ou plus sur 255
            fond, 9 carrés : moyenne  77.0 ; marqué encre  2.65 %
