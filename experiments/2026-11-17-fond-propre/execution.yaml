          - ["Carré 12 (famille B)", "moyenne 157 · très clair 15,4 %", "ligne 24 576, colonne 27 648 · à 7 309 px d'une annotation"]
          - ["Carré 13 (famille B)", "moyenne 150 · très clair 10,1 %", "ligne 23 552, colonne 38 912 · à 9 546 px d'une annotation"]
          - ["Carré 14 (famille B)", "moyenne 158 · très clair 15,8 %", "ligne 1 024, colonne 28 672 · à 1 610 px d'une annotation"]
          - ["Carré 15 (famille B)", "moyenne 154 · très clair 12,1 %", "ligne 26 624, colonne 15 360 · à 8 441 px d'une annotation"]
          - ["Carré 16 (famille B)", "moyenne 150 · très clair 10,1 %", "ligne 25 600, colonne 23 552 · à 10 125 px d'une annotation"]
        note: "Coordonnées du coin haut gauche, en pixels du segment. La liste complète est dans candidats.json."
      - genre: journal
        titre: "Ce que le script annonce"
        large: true
        texte: |
          prédiction (32249, 51380) ; masque (32249, 51380) ; surface niveau 2 (65, 8063, 12845)
          part annotée : 5.88 % ; part vide : 15.50 %
          carrés de 1024 : 1550 en tout, 957 sans vide et à plus de 512 px d'une annotation
          sur ces carrés : moyenne médiane 141 sur 255 ; part très claire médiane 11.1 %
          planche (2144, 1168), carte (1605, 992), 16 carrés écrits dans candidats.json
      - genre: fichiers
        titre: "Ce qui a été écrit"
        lieu: "dans le dépôt et dans local/apercus, ignoré par git"
        elements:
          - nom: "experiments/2026-11-17-fond-propre/candidats.json"
            taille: "4 ko"
            role: "Les seize carrés et leurs mesures. Des coordonnées, aucune donnée de rouleau."
          - nom: "local/apercus/X-011-candidats.png et X-011-carte.png"
            taille: "1,4 et 1,6 Mo"
            role: "La planche et la carte d'ensemble."

    limites: |
      - Le script ne reconnaît pas l'écriture : il ne fait que trier. Le jugement est humain, et Kanemonium n'est pas papyrologue : un carré douteux est écarté.
      - Le tri s'appuie sur la carte de X-003, donc sur le modèle de X-002 : il hérite de ses erreurs.
      - La planche montre une seule couche du scan, celle du milieu, réduite quatre fois.
      - Seize carrés font 1,0 % du segment : rien ne dit que ce soit assez pour changer le modèle.
      - Le script a été lancé deux fois : la seconde seulement pour grossir les numéros de la carte d'ensemble. Les seize carrés sont les mêmes.
      - Les carrés 9, 11 et 14 touchent le bord du segment : le contrôle des zones vides ne les a pas écartés.
      - Rien n'est mesuré sur l'effet : c'est l'objet de l'entraînement qui suivra.

