      - genre: journal
        titre: "Ce que le script annonce"
        large: true
        texte: |
          prédiction (32249, 51380) ; masque (32249, 51380) ; surface niveau 2 (65, 8063, 12845)
          part annotée : 5.88 % ; part vide : 15.50 %
          carrés de 1024 : 1550 en tout, 957 sans vide et à plus de 512 px d'une annotation
          sur ces carrés : moyenne médiane 141 sur 255 ; part très claire médiane 11.1 %
          planche (2144, 1168), carte (1605, 992), 16 carrés écrits dans candidats.json
      - genre: fichiers
        titre: "Ce qui a été écrit"
