  - id: X-012
    titre: "Réentraîner avec du fond propre"
    date: 2026-11-17
    statut: terminee
    piste: P-310
    taches: [T-020]
    resume: >-
      Suite de X-011. Neuf carrés jugés vierges sont entrés dans la zone de supervision comme fond.
      L'exécution est allée au bout, mais l'entraînement n'a tiré aucun bloc dans ces carrés : villa
      ne garde un bloc que s'il contient de l'encre étiquetée. Le modèle obtenu est celui de X-008,
      au chiffre près. La question du fond propre reste donc entière.

    bilan:
      - question: "Le type de résultat"
        valeur: "Un essai nul, et sa cause"
        detail: >-
          Les notes de validation, le F1 des quatre derniers points et la réponse sur les carrés
          sont identiques à ceux de X-008 et X-009. La liste des blocs compte 11 554 blocs dans
          les deux entraînements. Le chiffre d'avant, lui, est acquis : le modèle de X-008 marque
          comme encre 2,65 % des carrés « fond » et 3,30 % des carrés de contrôle.
        fiches: [K-16, K-26]
      - question: "La représentativité"
        valeur: "Le réglage de X-008, rejoué à l'identique"
        detail: >-
          La zone de supervision a bien grandi de 9,8 % dans les fichiers, mais le réglage
          `patch_min_labeled_coverage` à 0,05 écarte tout bloc où l'encre étiquetée couvre moins
          de 5 % du bloc. Un carré sans encre ne donne donc aucun bloc.
        fiches: [K-12]
      - question: "Ce que cela décide"
        valeur: "Rien sur le fond propre"
        detail: >-
          Il faut relancer avec un réglage qui admet les blocs sans encre. En passant, cet essai
          montre qu'un entraînement rejoué avec la même graine redonne exactement les mêmes
          notes : l'écart entre deux essais ne viendra pas du hasard de la machine.
        fiches: [K-16, K-09]

    code:
      - titre: "Le réglage : celui de X-008, plus une ligne"
        fichier: experiments/2026-11-17-fond-propre/fond-propre-128.json
        langage: json
        extrait: [9, 15]
        notes:
          - lignes: 11
            genre: donnees
            titre: "Les étiquettes en version 2"
            texte: >-
              villa prend alors les fichiers dont le nom finit par `_v2`, et exige que les
              étiquettes d'encre et le masque de supervision existent tous deux à cette version.
              Les fichiers du tutoriel ne sont pas touchés.
            fiches: [K-17]
          - lignes: 15
            genre: parametrage
            titre: "La ligne qui a rendu l'essai nul"
            texte: >-
              villa ne garde un bloc pour l'entraînement que si l'encre étiquetée y couvre au
              moins cette part du bloc (`data/patch_finding_default.py`, lignes 143 à 148 au commit
              `2d3fb38`). Dans un carré de fond, il n'y a pas d'encre : aucun bloc n'y est tiré.
              Repris tel quel de X-008, sans que nous l'ayons vu avant de lancer.
            fiches: [K-12]

      - titre: "Écrire les étiquettes en version 2"
        fichier: experiments/2026-11-17-fond-propre/masques.py
        langage: python
        extrait: [36, 59]
        notes:
          - lignes: 42
            genre: donnees
            titre: "Un garde-fou"
            texte: "Si un carré touche une annotation ou de l'encre étiquetée, le script s'arrête sans rien écrire."
          - lignes: 54
            genre: donnees
            titre: "Seuls les carrés « fond » entrent dans le masque"
            texte: >-
              Les étiquettes d'encre y sont noires : dans la zone de supervision, noir veut dire
              « pas d'encre ». Les carrés de contrôle n'y entrent pas.
            fiches: [K-08]
          - lignes: 58
            genre: parametrage
            titre: "Deux copies à la même version"
            texte: "Les étiquettes d'encre et les régions mises de côté, inchangées, sous le nom que villa attend."

      - titre: "Les six étapes"
        fichier: experiments/2026-11-17-fond-propre/etapes-entrainement.sh
        langage: bash
        extrait: [28, 71]
        notes:
          - lignes: [38, 40]
            genre: mesure
            titre: "Le chiffre d'avant"
            texte: >-
              Le point de référence, l'itération 19 000 de X-008, prédit les onze carrés. La part
              marquée encre est comptée à son seuil, 176 sur 255.
            fiches: [K-16]
          - lignes: [42, 51]
            genre: parametrage
            titre: "Reprendre plutôt que recommencer"
            texte: "S'il existe un point de sauvegarde, l'entraînement repart de là."
            fiches: [K-15]
          - lignes: [54, 58]
            genre: mesure
            titre: "Noter comme X-009, sur quatre points"
            texte: >-
              Les outils de [khj1222](https://github.com/khj1222/vesuvius-challenge), sur les
              itérations 17 000 à 20 000 : X-009 a montré que les premiers points ne valent rien,
              et quatre prédictions prennent une demi-heure au lieu de deux heures et demie.
            fiches: [K-26]
          - lignes: [60, 71]
            genre: mesure
            titre: "Le chiffre d'après"
            texte: >-
              Le point au meilleur F1 prédit les mêmes carrés. La part marquée encre est comptée
              à son propre seuil, puis au seuil 176 pour comparer à l'identique.

    sorties:
      - genre: mesures
        titre: "Le nouvel entraînement est celui de X-008"
        large: true
        lignes:
          - ["Blocs trouvés par villa", "11 554, comme pour X-008", "dont 6 567 pour l'entraînement ; la liste change de nom (`labels-v2`), pas de taille"]
          - ["Notes de validation pendant l'entraînement", "identiques", "le fichier `validation_metrics.jsonl` est le même, octet pour octet, que celui de X-008"]
          - ["F1, itération 17 000", "0,7296", "X-009 : 0,7296"]
          - ["F1, itération 18 000", "0,7548", "X-009 : 0,7548"]
          - ["F1, itération 19 000", "0,7762, seuil 176", "X-009 : 0,7762, seuil 176 ; précision 78,9 %, rappel 76,4 % dans les deux cas"]
          - ["F1, itération 20 000", "0,7683", "X-009 : 0,7683"]
          - ["Point gardé par villa", "itération 17 500, justesse équilibrée 0,816", "comme pour X-008"]
        note: >-
          Les fichiers des points de sauvegarde n'ont pas la même empreinte que ceux de X-008,
          mais tout ce qui a été mesuré avec eux est identique. Nous n'avons pas comparé les
          poids un à un.
      - genre: mesures
        titre: "Le chiffre d'avant : le modèle de X-008 sur du papyrus jugé vierge"
        large: true
        lignes:
          - ["Carré 1 (fond)", "4,80 %", "réponse moyenne 69,5 sur 255"]
          - ["Carré 2 (fond)", "0,59 %", "réponse moyenne 59,5"]
          - ["Carré 5 (fond)", "2,37 %", "réponse moyenne 73,2"]
          - ["Carré 6 (fond)", "2,20 %", "réponse moyenne 66,7"]
          - ["Carré 8 (fond)", "0,95 %", "réponse moyenne 62,0"]
          - ["Carré 10 (fond)", "1,49 %", "réponse moyenne 84,2"]
          - ["Carré 12 (fond)", "3,21 %", "réponse moyenne 94,1"]
          - ["Carré 13 (fond)", "2,32 %", "réponse moyenne 84,0"]
          - ["Carré 15 (fond)", "5,87 %", "réponse moyenne 99,6"]
          - ["Les neuf carrés « fond »", "2,65 %", "réponse moyenne 77,0"]
          - ["Carré 4 (contrôle)", "1,69 %", "réponse moyenne 66,6"]
          - ["Carré 16 (contrôle)", "4,92 %", "réponse moyenne 94,4"]
          - ["Les deux carrés de contrôle", "3,30 %", "réponse moyenne 80,5"]
        note: >-
          Part des pixels du carré que l'itération 19 000 de X-008 marque comme encre, au seuil
          176 sur 255. Le chiffre d'après, mesuré avec l'itération 19 000 du nouvel entraînement,
          est le même à la décimale près pour chaque carré : ce n'est pas un résultat, c'est le
          même modèle. Ces carrés ont été jugés vierges à l'œil, sans papyrologue.
      - genre: mesures
        titre: "Les étiquettes en version 2"
        lignes:
          - ["Zone de supervision avant", "95 935 984 pixels", "5,88 % de l'image"]
          - ["Zone de supervision après", "105 373 168 pixels", "6,36 % de l'image, soit 9,8 % de plus"]
          - ["Conversion", "3 fichiers écrits, 3 sautés", "9 min 08 s ; aucun échec"]
      - genre: mesures
        titre: "Durée et machine"
        lignes:
          - ["Du début à la fin", "3 h 05 min 51 s", "de 19 h 09 min 48 s à 22 h 15 min 39 s, sans reprise"]
          - ["Étiquettes et conversion", "9 min 29 s", "étapes 1 et 2"]
          - ["Chiffre d'avant", "5 min 09 s", "étape 3"]
          - ["Entraînement", "2 h 20 min 48 s", "étape 4 ; 20 000 itérations en 2 h 18 min 48 s d'après la barre de villa"]
          - ["Notation de quatre points", "26 min 13 s", "étape 5 ; 387 à 396 s par point"]
          - ["Chiffre d'après", "4 min 12 s", "étape 6"]
