      - github: ScrollPrize
        nom: "ScrollPrize/villa"
        lien: https://github.com/ScrollPrize/villa/tree/2d3fb38d33a18b257230c0bd23986436c3d4722e
        licence: MIT
        quoi: >-
          L'entraînement, la prédiction et la recherche de blocs du paquet `vesuvius`, au commit
          `2d3fb38`, et l'option `patch_cache_filename` de sa documentation.
        personnes:            # lignes par personne au commit 2d3fb38 (scripts/wsl/auteurs-villa.sh)
          - { github: erdpx, nom: "elian rafael", part: "1 122 lignes de train.py, 76 de patch_finding_default.py" }
          - { github: giorgioangel, nom: "Giorgio Angelotti", part: "176 lignes de train.py" }
          - { github: AndreasHad04, nom: "Andreas Hadjinicolaou", part: "19 lignes de train.py" }
          - { github: evilaliv3, nom: "Giovanni Pellerano", part: "10 lignes de patch_finding_default.py" }
          - { github: tencur, nom: "tencur", part: "2 lignes de patch_finding_default.py" }
      - github: ScrollPrize
        nom: "Vesuvius Challenge, tutoriel d'encre"
        lien: https://github.com/ScrollPrize/villa/tree/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org
