problemes:
  - id: F-01
    titre: "8 Go de mémoire vidéo"
    detail: "Mesuré le 2026-11-14 : avec les blocs du tutoriel la carte sature et l'entraînement prendrait 120 heures ; avec des blocs de 128, moins de 2 heures. L'effet sur la qualité reste inconnu."
    piste: P-420
  - id: F-02
    titre: "Outils pensés pour de grosses machines"
    detail: "WSL2 obligatoire sous Windows ; l'installation suppose des bibliothèques et une mémoire que le tutoriel ne dit pas. Constaté le 2026-11-14, voir P-410."
    piste: P-410
  - id: F-03
    titre: "Volumes de plusieurs téraoctets"
    detail: "Impossible de télécharger un rouleau entier : il faut lire les données par morceaux (OME-Zarr)."
    piste: P-310
  - id: F-04
    titre: "Un modèle par rouleau ne suffit pas"
    detail: "Les modèles d'encre se transfèrent mal d'un rouleau à l'autre, pour des raisons mal connues."
    piste: P-320
  - id: F-05
    titre: "Étiquettes approximatives"
    detail: "Les étiquettes viennent de prédictions relues à la main : un modèle peut apprendre nos erreurs."
    piste: P-250
  - id: F-07
    titre: "L'encre et le papyrus sont du même carbone"
    detail: "Aux rayons X, l'encre et le papyrus carbonisé se distinguent à peine. Nous ne savons pas dire quelle grandeur mesurable les sépare : c'est ce que P-370 et P-380 cherchent."
    piste: P-380
  - id: F-06
    titre: "Place sur le disque"
    detail: "Le segment du tutoriel pèse environ 25 Go. Le disque n'avait que 43,5 Go libres ; après ménage le 2026-11-14, 167 Go. Levé pour le tutoriel, mais de nouveau serré : 17 Go libres le 2026-11-17 après X-009 (97 % occupé), avec deux entraînements de 16 Go de points de sauvegarde chacun."
    piste: P-420

