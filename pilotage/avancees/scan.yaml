# Parcours du domaine « scan » : le défi tout entier. Format : pilotage/README.md.
# Écrit par scripts/avancees-depuis-releve.mjs à partir des pages de scrollprize.org (ScrollPrize/villa,
# commit 2d3fb38, licence MIT). Textes français : reformulation d'Agent C., pas une traduction officielle.
domaine: scan
portee: communaute
lu_le: 2026-11-15
resume: "Comment les rouleaux sont scannés et mis à disposition : du premier scan de 2019 aux acquisitions de
  l’ESRF. Le défi tout entier, lu dans les pages de scrollprize.org."
branches:
  - id: acquisitions
    titre: Scanner des rouleaux
  - id: reglages
    titre: Réglages et reconstruction
  - id: resolution
    titre: Plus fin que 2,4 µm
  - id: donnees
    titre: Données ouvertes
avancees:
  - id: A-101
    branche: acquisitions
    date: "2019"
    titre: Premiers scans de rouleaux et de fragments par EduceLab
    statut: acquis
    resume: L'équipe du professeur Brent Seales scanne des rouleaux d'Herculanum dans un accélérateur de
      particules, ainsi que des fragments détachés dont l'encre est visible.
    fonctionnel: "Ces scans sont le point de départ de tout le défi : ils donnent des volumes 3D de rouleaux
      fermés, et des fragments photographiés qui servent de vérité terrain (ground truth) pour apprendre à
      reconnaître l'encre. Les fragments scannés et photographiés fournissent le jeu de vérité terrain sur
      lequel un modèle d'encre peut être entraîné."
    technique: "La source parle de tomographie (CT-scans) 3D réalisée dans un accélérateur de particules, à des
      résolutions allant jusqu'à 4 µm. Les fragments détachés portant de l'encre visible ont été scannés et
      photographiés pour constituer un jeu de données de vérité terrain. La FAQ donne d'autres chiffres pour
      les premiers scans (7,91 µm pour les rouleaux, 3,24 µm pour les fragments) : voir « contradictions »."
    relu: true
    qui:
      - Brent Seales
      - EduceLab
      - Stephen Parsons
    fiches:
      - K-03
    sources:
      - titre: scrollprize.org · firstletters
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/22_firstletters.md
  - id: A-102
    branche: acquisitions
    date: null
    titre: Rouleau témoin carbonisé (« campfire scroll ») scanné sur un scanner de table
    statut: acquis
    resume: Stephen Parsons fabrique un faux rouleau, l'écrit avec deux encres, le carbonise dans un feu de camp
      et le scanne.
    fonctionnel: "Ce rouleau d'essai sert de terrain d'apprentissage : on y voit ce qu'un scan donne dans le
      meilleur des cas, et la différence entre une encre visible aux rayons X (ferro-gallique) et une encre au
      carbone, presque invisible."
    technique: Le rouleau a été écrit à l'encre de carbone (faible contraste en tomographie) et à l'encre
      ferro-gallique (fort contraste), puis carbonisé dans une boîte à biscuits et scanné sur un scanner de
      table (benchtop CT) Bruker SkyScan 1173. Les photos X brutes sont prises par pas de 0,15 degré sur 360
      degrés, soit 2400 photos ; la taille de voxel d'origine est de 26 µm (104 µm dans la version réduite du
      tutoriel).
    relu: true
    note_date: La source ne date pas la fabrication du « campfire scroll ».
    qui:
      - Stephen Parsons
      - EduceLab/University of Kentucky
    sources:
      - titre: scrollprize.org · tutorial1
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/04_tutorial1.md
  - id: A-103
    branche: donnees
    date: 2023-03-15
    titre: "Lancement du défi : scans de Diamond Light Source rendus publics"
    statut: acquis
    resume: Au lancement du Vesuvius Challenge, les scans à haute résolution de rouleaux de l'Institut de France,
      réalisés au synchrotron Diamond Light Source près d'Oxford, sont mis à disposition.
    fonctionnel: N'importe qui peut désormais travailler sur les volumes 3D des rouleaux fermés. Selon la page de
      données, les rouleaux 1 à 4 et les fragments 1 à 6 scannés à Diamond avant 2025 forment le jeu de
      données historique « EduceLab-Scrolls » ; la source ne précise pas lesquels étaient publiés dès le
      lancement.
    technique: Le synchrotron produit un faisceau parallèle de rayons X à haut flux ; les photos X sont converties
      en volume de voxels par reconstruction tomographique. Selon la FAQ, les premiers rouleaux ont été
      scannés à 7,91 µm et les fragments à 3,24 µm, aux énergies de 54 keV et 88 keV. La FAQ précise qu'on ne
      connaît pas la résolution minimale nécessaire pour détecter l'encre.
    relu: true
    note_date: Date du lancement du défi et de la mise à disposition des scans ; la date d'acquisition à Diamond
      n'est pas donnée dans ce passage.
    qui:
      - Nat Friedman
      - Daniel Gross
      - Brent Seales
      - Institut de France
      - Diamond Light Source
      - EduceLab
    fiches:
      - K-03
    sources:
      - titre: scrollprize.org · grandprize
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/26_grandprize.md
