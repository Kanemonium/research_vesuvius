        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/09_faq.md
  - id: A-111
    branche: donnees
    date: 2026-06-25
    titre: "Données ouvertes : volumes en OME-Zarr diffusés en continu"
    statut: acquis
    resume: Les données tomographiques, les surfaces reconstruites et les transcriptions sont publiées sous
      licence Creative Commons et archivées à l'ESRF.
    fonctionnel: "On n'a plus besoin de télécharger des dizaines de téraoctets : les outils lisent seulement la
      région utile. Un navigateur de données recense rouleaux, fragments, segments et prédictions d'encre."
    technique: "Dépôt ouvert s3://vesuvius-challenge-open-data/, hébergé via le programme AWS Open Data, au format
      OME-Zarr (découpé en blocs, multi-résolution). Licence CC-BY-NC 4.0 sauf mention contraire. Jeux
      organisés : volumes, segments, représentations/prédictions, métadonnées ; points de contrôle de modèles
      et jeux d'étiquettes sur Hugging Face."
    relu: true
    note_date: Date de l'annonce de la lecture de PHerc. 1667, qui précise la mise à disposition ouverte des données.
    qui:
      - Vesuvius Challenge
      - ESRF
      - AWS
    fiches:
