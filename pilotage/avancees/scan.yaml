        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/07_tutorial5.md
  - id: A-107
    branche: reglages
    date: "2026"
    titre: "Régime actuel pour un rouleau entier : 2,4 µm, 22 cm, environ 78 keV"
    statut: acquis
    resume: Pour les scans récents de rouleaux entiers à l'ESRF, le réglage pratique retenu est de 2,4 µm avec une
      courte distance de propagation.
    fonctionnel: "C'est sur ces scans qu'ont été obtenus la lecture complète de PHerc. 1667 et l'encre directement
      visible dans PHerc. Paris. 4. La source précise que ce n'est pas une recette universelle : des rouleaux
      très grands ou très petits peuvent demander des ajustements."
    technique: "Micro-tomographie X à contraste de phase (phase-contrast) sur BM18 : environ 2,4 µm de voxels
      isotropes, 22 cm de distance de propagation, environ 78 keV d'énergie incidente moyenne. Trois
      paramètres sont couplés : taille de voxel, énergie, distance échantillon-détecteur. Trop de propagation
      floute le volume au lieu de l'éclaircir."
    relu: true
    note_date: « 2026 » vient de la mention « updated scans (2026) » dans 02_data.md ; la page des problèmes
      ouverts (14 octobre 2026) parle de « recent full-scroll scans ».
    qui:
      - Vesuvius Challenge
      - ESRF (BM18)
      - National Library of Naples “Vittorio Emanuele III”
    fiches:
      - K-04
      - K-05
    sources:
