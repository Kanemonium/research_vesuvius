  - id: A-108
    branche: reglages
    date: null
    titre: "Reconstruction : trajectoire hélicoïdale, récupération de phase de Paganin"
    statut: acquis
    resume: Les scans BM18 sont reconstruits par une chaîne qui assemble plusieurs passes hélicoïdales décalées et
      renforce le contraste par récupération de phase.
    fonctionnel: On peut scanner des objets plus larges que le champ du détecteur, et obtenir un volume plus
      contrasté à partir des franges de phase. La chaîne de reconstruction utilisée est publique.
    technique: "Les projections sont acquises en trajectoire hélicoïdale à jusqu'à quatre positions décalées
      latéralement, qui pavent des régions annulaires se recouvrant en partie. Après corrections (champ plat,
      distorsion du détecteur, alignement des recouvrements), une récupération de phase de Paganin à une seule
      distance est appliquée, puis le volume est reconstruit par rétroprojection hiérarchique accélérée sur
      GPU. Chaîne citée : night_rail_bm18."
    relu: true
    note_date: Décrit dans la FAQ sans date ; concerne les « recent scroll scans » de BM18.
    qui:
      - ESRF (BM18)
    fiches:
      - K-05
    sources:
      - titre: scrollprize.org · faq
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/09_faq.md
  - id: A-109
    branche: resolution
    date: null
    titre: "Très haute résolution (0,55 µm) : l'origine des zones « compressées » comprise"
    statut: acquis
    resume: "Des essais à 0,55 µm expliquent pourquoi certaines zones d'un scan sont floues : les fibres
      carbonisées très tassées brouillent le faisceau."
    fonctionnel: "On sait maintenant que la qualité d'un scan est locale : un même volume peut contenir
      d'excellentes zones et des zones presque impossibles à dérouler. Cela oriente les réglages (voxels plus
      petits, propagation plus courte) et explique des échecs en aval."
    technique: À 0,55 µm de taille de pixel détecteur (ligne ID11 de l'ESRF, sur PHerc. 500P2), on voit les parois
      cellulaires et les cavités (lumen) des fibres. Tassées, ces microstructures dévient le faisceau et
      créent un voile ; la source avance que les fibres carbonisées sont probablement proches du graphite,
      fort « décohéreur ». Une même zone de PHerc. Paris. 4 est montrée à 7,91 µm (DLS) et 2,4 µm (ESRF).
    relu: true
    note_date: La page (mise à jour le 14 octobre 2026) parle d'expériences « récentes » sans date.
    qui:
      - Vesuvius Challenge
      - ESRF (ID11)
    fiches:
      - K-04
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
  - id: A-110
    branche: resolution
    date: null
    titre: "Petites régions à 1,1 µm : l'encre y est nettement plus lisible"
    statut: acquis
    resume: De petites régions ont été imagées jusqu'à 1,1 µm ; l'encre y ressort mieux qu'à 2,4 µm.
    fonctionnel: La source dit avoir des indices que les données à 1,1 µm donnent des résultats plus nets que
      celles à 2,4 µm. Mais scanner un rouleau entier à cette finesse n'est pas praticable aujourd'hui.
    technique: "La source compare la même zone : à 1,1 µm on lit deux lignes de grec, à 2,4 µm seulement deux
      mots. Diviser la taille de voxel par deux multiplie le nombre de voxels par huit ; passer de 8 µm à 2 µm
      représente environ 64 fois plus de données."
    relu: true
    note_date: Constat rapporté dans la page du 14 octobre 2026 et dans la FAQ, sans date d'acquisition.
    qui:
      - Vesuvius Challenge
    fiches:
      - K-04
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
