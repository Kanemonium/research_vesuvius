        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/02_data.md
  - id: A-104
    branche: reglages
    date: "2024"
    titre: Quatre rouleaux scannés début 2024, prix 2024 portant sur les rouleaux 1 à 5 ; recherche des meilleurs
      réglages
    statut: acquis
    resume: Début 2024, le défi parle de quatre rouleaux scannés ; les prix 2024 portent sur les rouleaux 1 à 5 et
      demandent à la communauté d'analyser les scans pour trouver les meilleurs réglages.
    fonctionnel: La liste de souhaits 2024 propose d'analyser les scans multi-énergies et multi-résolutions pour
      trouver les réglages de scan optimaux (la source ne précise pas le critère). La communauté est invitée à
      comparer les scans multi-énergies et multi-résolutions et à les recaler entre eux.
    technique: La liste de souhaits 2024 mentionne l'analyse des scans multi-énergies / multi-résolutions et le
      recalage de volumes (volume registration) par techniques déformables. Un volume du rouleau 5 (PHerc.
      172) est référencé à 53 keV et 7,91 µm dans la page « Virtual Unwrapping ».
    relu: true
    note_date: Année des prix 2024 ; les sources lues ne datent pas l'acquisition du rouleau 5.
    qui:
      - Vesuvius Challenge
    sources:
      - titre: scrollprize.org · grandprize
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/26_grandprize.md
      - titre: scrollprize.org · 2024 prizes
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/28_2024_prizes.md
  - id: A-105
    branche: acquisitions
    date: 2025-07
    titre: "Acquisitions hélicoïdales sur BM18 (ESRF) : un grand rouleau en moins de deux heures"
    statut: acquis
    resume: L'équipe met au point des acquisitions hélicoïdales sur la ligne BM18 de l'ESRF et scanne plus de
      trente rouleaux.
    fonctionnel: Le temps de scan est plus que divisé par deux, tout en améliorant la résolution effective. À
      cette date, l'encre reste difficile à faire apparaître dans toutes ces nouvelles données ; la source
      ajoute toutefois qu'un titre a été extrait de l'un des rouleaux fermés dits « lisibles ».
    technique: Acquisitions tétra-, hexa- et octo-hélicoïdales sur la ligne de lumière (beamline) BM18 de l'ESRF ;
      un grand rouleau est scanné à 9,2 µm de taille de pixel en moins de deux heures. Plus de trente rouleaux
      scannés sous différents réglages, en variant résolution et mécanismes de contraste.
    relu: true
    note_date: Date de la page « Master Plan » (25 juillet 2025), qui décrit l'état à cette date.
    qui:
      - Vesuvius Challenge
      - ESRF (BM18)
    sources:
      - titre: scrollprize.org · master plan
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/27_master_plan.md
  - id: A-106
    branche: reglages
    date: "2025"
    titre: "Réglage « basse résolution » : environ 9 µm, 1,2 m, 110 keV"
    statut: acquis
    resume: De nombreux échantillons ont été scannés avec un réglage à environ 9 µm qui semblait optimal, mais qui
      s'est révélé moins bon que le réglage à 2,4 µm.
    fonctionnel: De nombreux échantillons ont été scannés avec ce réglage. Les modèles d'encre « 9 µm » partagés
      dans le tutoriel travaillent à une résolution commune d'environ 9 µm ; ils servent à chercher de l'encre
      dans des rouleaux que personne n'a encore lus, pour lesquels il n'existe pas d'étiquettes.
    technique: Environ 9 µm de voxels isotropes, 1,2 m de distance de propagation (échantillon-détecteur), environ
      110 keV d'énergie incidente moyenne. Le tutoriel cite un volume natif de PHerc. 0139 à 9,362 µm.
    relu: true
    note_date: La source ne date pas ce réglage ; « 2025 » vient de la mention des « 2025 scans » (fiche ESRF)
      dans 02_data.md et des noms de volumes à 9,362 µm cités dans le tutoriel.
    qui:
      - Vesuvius Challenge
    fiches:
      - K-04
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
