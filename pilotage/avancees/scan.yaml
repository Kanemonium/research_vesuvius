  - id: A-112
    branche: resolution
    date: 2026-10-14
    titre: "Problème ouvert : zones dégradées dès le scan et résolution sub-micronique impraticable"
    statut: ouvert
    resume: Certaines zones sortent du scanner déjà dégradées, et on ne sait pas scanner un rouleau entier en
      dessous du micron.
    fonctionnel: "Quand l'encre n'apparaît pas, on ne sait pas toujours si c'est le scan, la surface, les
      étiquettes ou le modèle qui limite : il faut l'évaluer rouleau par rouleau. La source demande des
      métriques de qualité de scan et des recettes d'acquisition propres à chaque rouleau."
    technique: "Le papyrus très tassé diffuse le faisceau en un voile qu'aucun algorithme en aval ne pourra
      peut-être entièrement défaire. Approches actuelles citées : meilleurs régimes de scan, voxels plus
      petits, distance de propagation plus courte, récupération de phase."
    relu: true
    note_date: Date de dernière mise à jour de la page « Open Problems ».
    qui:
      - Vesuvius Challenge
    sources:
      - titre: scrollprize.org · 2026 open problems
