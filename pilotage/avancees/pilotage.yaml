    statut: acquis
    resume: "Toute proposition dans un dépôt du défi naîtra d'un problème rencontré sur de vraies données, avec sa preuve."
    fonctionnel: "L'équipe ferme sans commentaire les propositions qui ne suivent pas ses règles ; nous les avons inscrites dans nos consignes."
    technique: "Résumé dans `docs/contribuer-a-villa.md`, à relire quand villa change."
    pistes: [D-010]
    sources:
      - { titre: "villa, CONTRIBUTING.md", lien: "https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/CONTRIBUTING.md" }
