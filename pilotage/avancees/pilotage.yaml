# Parcours du domaine « Pilotage » : seulement le nôtre. Format : pilotage/README.md.
domaine: pilotage
portee: nous
resume: >-
  Comment nous travaillons : un dépôt public, un carnet de recherche tenu au fil de l'eau, et
  Hephaist'OS pour le lire. Chaque nœud est une règle ou un outil de travail qui s'est ajouté.
branches:
  - { id: depot, titre: "Le dépôt et ses règles" }
  - { id: ihm, titre: "Hephaist'OS" }
  - { id: communaute, titre: "La communauté" }
avancees:
  - id: A-501
    branche: depot
    date: "2026-11-14"
    titre: "Un dépôt ouvert, un carnet, une IHM"
    statut: acquis
    resume: "Le premier jour : le dépôt sous licence MIT, le carnet en fichiers texte et l'interface locale pour le lire."
    fonctionnel: "Tout ce que nous décidons et mesurons est écrit, daté et relisible ; l'interface se met à jour seule quand un fichier change."
    technique: "Carnet en Markdown et YAML dans `pilotage/`. Serveur Node sans compilation, jeton GitHub gardé côté serveur."
    pistes: [D-002, D-003, P-510]
  - id: A-502
    branche: depot
    date: "2026-11-14"
    titre: "Le dépôt en ligne"
    statut: acquis
    resume: "Le dépôt est publié sur GitHub, avec des contrôles automatiques à chaque envoi."
    fonctionnel: "Le défi exige que toute méthode primée soit publique. Trois contrôles tournent à chaque envoi : le carnet et l'IHM, le code de recherche, l'absence de secret."
    technique: "Dépôt `Kanemonium/research_vesuvius`. Tâche T-006."
    pistes: [D-002]
  - id: A-503
    branche: ihm
    date: "2026-11-14"
    titre: "Des emblèmes et une documentation illustrée"
    statut: acquis
    resume: "Chaque domaine a son emblème coloré ; chaque notion nouvelle a sa fiche bilingue avec une planche."
    fonctionnel: "On se repère d'un coup d'œil, et une notion inconnue s'apprend sans quitter l'outil."
    technique: "Fiches `K-…` en français et en anglais dans `docs/concepts/`, planches SVG sans texte."
    pistes: [D-004, D-005, D-006]
  - id: A-504
    branche: ihm
    date: "2026-11-15"
    titre: "V1.1 : dire ce qu'une exécution a produit"
    statut: acquis
    resume: "Chaque exécution a sa page : ce qu'elle a produit, le code utile annoté, les sorties, ce qu'elle ne dit pas."
    fonctionnel: "Un entraînement de deux heures ne laisse plus seulement des chiffres : on sait ce qu'ils veulent dire."
    technique: "Fichiers `execution.yaml` par expérience ; trois questions fixes (type de résultat, représentativité, niveau d'optimisation)."
    pistes: [P-511, D-007]
  - id: A-505
    branche: depot
    date: "2026-11-15"
    titre: "Citer le travail des autres, jusqu'à la personne"
    statut: acquis
    resume: "Tout code repris porte son auteur, sa source et sa licence, dans le code, les exécutions et les commits."
    fonctionnel: "Nous ne nous approprions le travail de personne ; le vérificateur refuse une exécution sans crédits."
    technique: "Auteurs retrouvés ligne par ligne dans l'historique complet de villa (`scripts/wsl/auteurs-villa.sh`)."
    pistes: [D-008]
  - id: A-506
    branche: ihm
    date: "2026-11-15"
    titre: "V1.2 : suivre, geler et reprendre depuis l'IHM"
    statut: acquis
    resume: "Barre d'avancement, journal en direct, boutons de pause et de reprise sur chaque exécution."
    fonctionnel: "La page d'une exécution est écrite avant de lancer, se suit pendant, se complète après."
    technique: "Lanceur unique `scripts/wsl/lancer-execution.sh`, qui alimente l'état et le journal lus par l'IHM."
    pistes: [P-512, D-009]
  - id: A-507
    branche: communaute
    date: "2026-11-15"
    titre: "V1.3 : suivre le Discord et GitHub du défi en français"
