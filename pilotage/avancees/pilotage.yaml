    resume: "Un tiroir avec la synthèse, les mentions, l'actualité et les règles de contribution de villa."
    fonctionnel: "Les échanges anglais de la communauté deviennent lisibles. Validée par Kanemonium le 2026-11-17 ; l'envoi de réponses est une autre avancée (A-510)."
    technique: "Lecture à la demande, rangée hors dépôt ; l'actualité publique de GitHub relevée par `scripts/villa-actu.mjs`."
    pistes: [P-513, D-010]
  - id: A-508
    branche: communaute
    date: "2026-11-15"
