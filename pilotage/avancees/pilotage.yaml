    fonctionnel: "Notre vision s'agrège à celle du défi tout entier : ce que la communauté a franchi, et où nous en sommes."
    technique: "Journal découpé en cellules (`ihm/lib/carnet.mjs`) ; avancées par domaine dans `pilotage/avancees/`."
