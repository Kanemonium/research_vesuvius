# Parcours du domaine « Outils » : seulement le nôtre. Format : pilotage/README.md.
domaine: outils
portee: nous
resume: >-
  Faire tourner les programmes du défi sur un ordinateur portable ordinaire : Windows, une carte
  graphique de 8 Go, un disque limité. Chaque nœud est une chose que notre machine sait faire
  désormais, mesurée dans une exécution.
branches:
  - { id: installer, titre: "Installer" }
  - { id: entrainer, titre: "Entraîner" }
  - { id: predire, titre: "Prédire, longtemps" }
avancees:
  - id: A-401
    branche: installer
    date: "2026-11-14"
    titre: "Ubuntu sous Windows, carte graphique reconnue"
    statut: acquis
    resume: "Le code de recherche tourne dans Ubuntu (WSL 2), avec la carte graphique visible depuis Ubuntu."
    fonctionnel: "Sans cela, aucun programme du défi ne se lance sur notre machine. Tâche T-001."
    technique: "WSL 2, Ubuntu 24.04, environnements Python gérés par `uv`. RTX 3080 Laptop, 8 Go de mémoire vidéo."
    pistes: [P-410]
  - id: A-402
    branche: installer
    date: "2026-11-14"
    titre: "La chaîne d'encre de villa installée"
    statut: acquis
    resume: "Le paquet de détection d'encre de villa s'installe et se lance chez nous, après deux obstacles d'installation."
    fonctionnel: "Nous pouvons entraîner et prédire avec le même code que l'équipe du défi. Tâche T-002 ; les obstacles sont décrits dans P-410."
    technique: "Dépôt [ScrollPrize/villa](https://github.com/ScrollPrize/villa) au commit `2d3fb38`, paquet `vesuvius.ink_detection`."
    pistes: [P-410]
    fiches: [K-17]
  - id: A-403
    branche: installer
    date: "2026-11-14"
    titre: "Le segment du tutoriel sur le disque"
    statut: acquis
    resume: "Le segment étiqueté du tutoriel d'encre est téléchargé en entier : environ 87 Go."
    fonctionnel: "C'est notre seule donnée d'entraînement pour l'instant. Tâche T-003."
    technique: "Segment `w00_20231016151002` de PHerc. Paris. 4, au format OME-Zarr. Le dépôt ne contient que la commande de téléchargement, jamais la donnée."
    pistes: [P-310]
    fiches: [K-10, K-07]
  - id: A-404
    branche: entrainer
    date: "2026-11-14"
    titre: "Entraîner dans 8 Go : des blocs de 128"
    statut: acquis
    resume: "Avec les blocs du tutoriel la carte sature ; avec des blocs de 128 l'entraînement tient et devient praticable."
    fonctionnel: "Un entraînement complet passe de plusieurs jours estimés à moins de deux heures. L'effet sur la qualité du modèle n'est pas mesuré."
    technique: "Essais courts X-001 : mémoire vidéo et vitesse relevées pour plusieurs tailles de bloc."
    pistes: [P-420]
    executions: [X-001]
    fiches: [K-12, K-14]
  - id: A-405
    branche: entrainer
    date: "2026-11-14"
    titre: "Premier entraînement complet"
    statut: acquis
    resume: "Le modèle du tutoriel entraîné jusqu'au bout sur notre machine : 20 000 itérations."
    fonctionnel: "Nous avons un modèle à nous, avec son point de sauvegarde, pour prédire. Ce qu'il vaut reste à regarder sur une image."
    technique: "U-Net 3D de villa, 102 millions de valeurs réglables, blocs de 128. Détail et courbe de perte dans X-002."
    pistes: [P-420]
    executions: [X-002]
    fiches: [K-11, K-13, K-15]
  - id: A-406
    branche: predire
    date: "2026-11-15"
    titre: "Arrêter et reprendre une exécution longue"
    statut: acquis
    resume: "Une prédiction se découpe en bandes et reprend à la première manquante ; un entraînement repart de son point de sauvegarde."
    fonctionnel: "Une exécution de plusieurs heures ne bloque plus l'ordinateur : on la gèle, on l'arrête, on la relance sans tout refaire."
    technique: "Découpage par l'option `--roi` de villa. Vérifié sur une petite zone dans X-004 : deux bandes redonnent l'image à 0,9 % de pixels près, d'un niveau sur 255 au plus."
    pistes: [P-420, D-009]
    executions: [X-004]
  - id: A-407
    branche: predire
    date: "2026-11-15"
    titre: "Première prédiction d'un segment entier"
    statut: acquis
    resume: "Le modèle a parcouru tout le segment du tutoriel, en 16 bandes et 5 h 34 min, sans reprise."
    fonctionnel: "Notre machine sait produire une image d'encre de 1,66 milliard de pixels. L'image ne prouve rien sur le modèle : le segment a servi à l'entraînement."
    technique: "Exécution X-003 : 346 481 blocs, 17 blocs par seconde, lot de 4, pic de mémoire vidéo de 4 870 Mo."
    pistes: [P-310]
    executions: [X-003]
    fiches: [K-08]
  - id: A-408
    branche: predire
    date: null
    titre: "Raccourcir le temps de prédiction"
    statut: ouvert
    resume: "Trois propositions publiques visent la vitesse de la prédiction d'encre de villa ; aucune n'est fusionnée ni essayée chez nous."
    fonctionnel: "Si l'une tient ses promesses sur notre carte, une prédiction de plusieurs heures raccourcirait d'autant."
    technique: "À mesurer nous-mêmes, avant et après, sur le même segment. Rien n'est acquis tant que ce n'est pas mesuré."
    pistes: [P-420]
    sources:
      - { titre: "villa, demande de fusion 2521", lien: "https://github.com/ScrollPrize/villa/pull/2521" }
      - { titre: "villa, demande de fusion 2525", lien: "https://github.com/ScrollPrize/villa/pull/2525" }
  - id: A-409
    branche: installer
    date: "2026-11-19"
    titre: "Nouvelle machine : RTX 5080, 16 Go"
    statut: acquis
    resume: "Le projet a migré sur un nouveau PC ; Ubuntu, villa et PyTorch y tournent et la carte calcule."
    fonctionnel: "Deux fois plus de mémoire vidéo qu'avant. Les mesures X-001 à X-014 valent pour l'ancienne machine et sont à refaire avant comparaison. Le segment du tutoriel n'a pas suivi : il faut le retélécharger (A-403)."
    technique: "Vérifié le 2026-11-20 : RTX 5080 16 303 Mo, pilote 617.42 ; WSL 2, Ubuntu 24.04.5, 16 cœurs, 22 Go ; PyTorch 2.12.1 (CUDA 13.0, sm_120), calcul d'essai réussi. Villa au commit `0bddf27` (2026-11-18)."
    pistes: [P-410]
  - id: A-410
    branche: entrainer
    date: "2026-11-20"
    titre: "La ligne de base en 44 minutes"
    statut: acquis
    resume: "Le même entraînement que X-002, sur la nouvelle carte : 43 min 45 s au lieu de 1 h 53."
    fonctionnel: "Un entraînement complet tient désormais dans une heure. C'est le nouveau point de comparaison pour les essais suivants. La qualité du modèle n'est pas mesurée."
    technique: "Exécution X-015 : 7,70 itérations par seconde au lieu de 2,93, pic de mémoire vidéo de 6 694 Mo sur 16 303, avec la recette de 8 Go gardée telle quelle (blocs de 128, lot de 2)."
