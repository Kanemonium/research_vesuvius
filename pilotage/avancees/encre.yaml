# Parcours du domaine « encre » : le défi tout entier. Format : pilotage/README.md.
# Écrit par scripts/avancees-depuis-releve.mjs à partir des pages de scrollprize.org (ScrollPrize/villa,
# commit 2d3fb38, licence MIT). Textes français : reformulation d'Agent C., pas une traduction officielle.
domaine: encre
portee: communaute
lu_le: 2026-11-15
resume: >-
  Comment on fait apparaître une encre presque invisible aux rayons X : des fragments ouverts aux premiers
  rouleaux lus, et ce qui résiste encore. Le défi tout entier, lu dans les pages de scrollprize.org ; nos
  propres pas y figurent à leur date.


  **Ce qui est acquis**


  - Un rouleau d'Herculanum scellé peut être déroulé virtuellement et lu : PHerc. 1667 a été lu d'un bout à
  l'autre en 2026.

  - Les modèles entraînés sur des fragments se généralisent assez pour amorcer une lecture propre à un
  rouleau, que le pseudo-étiquetage itératif fait ensuite progresser des lettres isolées jusqu'au rouleau
  entier.

  - Le Grand Prix 2023 a été atteint : 4 passages de 140 caractères, plus 11 autres colonnes, soit plus de
  2000 caractères dans PHerc. Paris. 4, avec un code publié en open source.

  - Les textes obtenus ne sont pas inventés par le modèle : reproduction technique indépendante, plusieurs
  soumissions concordantes sur la même zone, petites fenêtres d'entrée/sortie.

  - Deux titres de rouleaux fermés ont été retrouvés : PHerc. 172 (Philodème, Sur les vices, livre 1) et
  PHerc. 139 (Philodème, Sur les dieux, livre 8).

  - Un scan à haute résolution peut rendre visible une encre jusque-là insaisissable, et la segmentation
  volumétrique directe de l'encre est possible dans les cas favorables (PHerc. Paris. 4 à 2,4 µm).

  - Des modèles et jeux de données sont publics : modèle courant à 2,4 µm (ink_canonical_2um), modèles
  multi-rouleaux à 9 µm (ink_9um), six points de contrôle PHerc. 1667, jeu « ink-labels ».

  - En octobre 2026, de l'écriture a été trouvée dans deux rouleaux jamais lus (PHerc. 306B et PHerc. 343).

  - Un premier progrès de généralisation entre rouleaux : une configuration trouvée par un essaim d'agents a
  presque doublé le Dice de validation sur PHerc. 1667 en n'entraînant que sur PHerc. 139.

  - La morphologie de surface seule (profilométrie optique sur fragments ouverts) contient une information
  exploitable pour localiser l'encre.


  **Ce qui résiste**


  - Généralisation entre rouleaux : un modèle d'encre peut marcher sur un rouleau et pas sur un autre ;
  l'équipe n'a parfois aucune explication.

  - Le pseudo-étiquetage n'est pas garanti : dans certains rouleaux les prédictions plafonnent, dans d'autres
  les modèles ne montrent presque rien de convaincant.

  - On ne sait pas dire de façon fiable si l'encre est absente ou seulement pas encore récupérée, ni quelle
  étape de la chaîne limite le résultat.

  - Nature du signal : dans les deux rouleaux lisibles en 2025, le signal amplifié correspondait à de grosses
  craquelures ou à des points riches en métal ; les modèles entraînés là-dessus échouent sur les autres
  rouleaux.

  - Ambiguïté de profondeur : les photos de fragments donnent des étiquettes 2D, sans dire où le signal
  d'encre se trouve en profondeur dans le volume.

  - Les données 3D densément étiquetées manquent : les étiquettes de confiance au niveau du voxel sont rares.
  Dans les rouleaux, aucune vérité terrain infrarouge n'existe.

  - La résolution aide (1,1 µm est plus propre que 2,4 µm) mais scanner un rouleau entier à cette finesse est
  impraticable ; la résolution minimale nécessaire pour détecter l'encre reste inconnue.

  - La segmentation 3D directe ne vaut que dans des conditions favorables : tous les rouleaux ne se
  comporteront pas comme PHerc. Paris. 4, et le modèle publié est propre à ce rouleau.

  - Le titre de PHerc. Paris. 4 (rouleau 1) reste introuvable : la zone attendue n'a montré aucune encre
  détectable, peut-être une autre encre, et les rangées du haut manquent physiquement.

  - On ne sait pas encore si les modèles existants marcheront sur les rouleaux non lus ; un modèle propre au
  rouleau peut être nécessaire. Une enquête communautaire sur 21 rouleaux n'a trouvé aucune lettre.

  - Garde-fou, risque d'hallucination de lettres : plus la fenêtre du modèle est grande, plus il lui est
  facile d'inventer des formes de lettres plausibles. Règle actuelle (prix 2027) : les grandes fenêtres sont
  permises, à condition de démontrer que le texte n'est pas halluciné, par exemple sur une région tenue à
  l'écart.

  - Garde-fou, taille des blocs (règle 2023 et 2024) : fenêtres de plus de 0,5 x 0,5 mm fortement
  déconseillées, soit 64 x 64 pixels pour un scan à 8 µm ; une soumission pouvait être refusée pour cette
  raison.

  - Garde-fou, mémorisation : aucune superposition entre les régions d'entraînement et de prédiction ; les
  sorties du modèle ne doivent recouvrir aucune donnée d'entraînement.

  - Garde-fou, auto-renforcement des erreurs : comme les étiquettes viennent de prédictions du modèle,
  celui-ci ne voit que de petits patchs plus petits qu'une lettre, l'étiquetage est prudent, des régions de
  validation sont tenues à l'écart et la lecture finale revient toujours aux papyrologues.

  - Validation insuffisante dans le tutoriel : le segment d'exemple n'a pas de masque de validation, donc pas
  de mesure sur données tenues à l'écart ; un contributeur note que les améliorations ne se distinguent alors
  pas du bruit.

  - Fragilité des modèles 9 µm : sensibles au décalage en profondeur de la surface ; un modèle entraîné sur un
  seul segment reste loin d'une bonne lecture sur un segment jamais vu.

  - Le modèle n'est pas un lecteur : il ne reçoit ni mots grecs, ni transcriptions, ni dictionnaire ; il fait
  de la récupération de signal, la lecture restant humaine.
