    titre: "Premières lettres dans deux nouveaux rouleaux : PHerc. 306B et PHerc. 343"
    statut: acquis
    resume: Deux prix « First Letters » sont attribués pour de l'écriture trouvée dans des rouleaux où rien
      n'avait encore été lu.
    fonctionnel: La détection d'encre fonctionne donc sur de nouveaux rouleaux. Ces deux rouleaux sortent de la
      liste éligible ; il reste au plus 8 prix de ce type à gagner.
    technique: "Critère : 10 lettres dans une zone de 4 cm². PHerc. 306B : lecture probable « τὸ δι᾽ αὑτὸ αἱρετόν
      » (ce qui est désirable en soi). PHerc. 343 : texte trouvé en profondeur dans le rouleau, traduit « tout
      ce qui arrive / est engendré ». Les fichiers lus ne décrivent pas les méthodes employées."
