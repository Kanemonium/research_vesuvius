  - id: A-314
    branche: generalisation
    date: 2026-10-14
    titre: "Problème ouvert : faire marcher la détection d'encre sur tous les rouleaux"
    statut: ouvert
    resume: "Le pseudo-étiquetage a permis de lire PHerc. 1667, mais rien ne garantit qu'il marche ailleurs : dans
      certains rouleaux les prédictions plafonnent, dans d'autres on ne voit presque rien."
    fonctionnel: "On ne sait pas distinguer de façon fiable « pas d'encre » de « encre pas encore récupérée ». Le
      titre de PHerc. Paris. 4 n'a pas été trouvé. Une enquête communautaire sur 21 rouleaux de la liste First
      Letters n'a trouvé aucune lettre. Pistes citées : entraînement multi-rouleaux, meilleures étiquettes,
      diagnostics plus solides, segmentation 3D directe."
    technique: "Causes possibles listées : le scan ne capte pas assez le signal ; la surface est légèrement mal
      placée ; les étiquettes ne correspondent pas à la vraie position du signal ; le modèle n'exploite pas
      les bonnes caractéristiques ; la morphologie ou la chimie de l'encre diffère selon les rouleaux.
      Ambiguïté de profondeur : les photos de fragments donnent des étiquettes 2D, pas la position 3D de
      l'encre. Les données 3D densément étiquetées sont désignées comme le goulot."
    note_date: Date de dernière mise à jour de la page « Open Problems ».
    qui:
      - Vesuvius Challenge
      - Matteo Bulloni
