  - id: A-304
    branche: lectures
    date: 2023-10-12
    titre: "Premières lettres : le mot ΠΟΡΦΥΡΑϹ lu dans un rouleau fermé"
    statut: acquis
    resume: Luke Farritor puis Youssef Nader, indépendamment, font apparaître le même mot (« pourpre ») dans le
      rouleau 1.
    fonctionnel: "Pour la première fois, un mot entier est lu à l'intérieur d'un rouleau non ouvert, et validé par
      des papyrologues. Le modèle de Youssef produit peu après quatre colonnes et demie de texte : le Grand
      Prix devient atteignable."
    technique: "Luke entraîne un modèle sur le crackle : chaque nouveau crackle trouvé améliore le modèle, qui en
      révèle d'autres. Youssef part des modèles gagnants de Kaggle, les adapte aux rouleaux (pré-entraînement
      non supervisé sur les rouleaux, puis affinage sur les étiquettes des fragments), puis itère des
      pseudo-étiquettes ; ses modèles finaux sont entraînés uniquement sur des segments de rouleau. Critère du
      prix : au moins 10 lettres dans 4 cm². Les papyrologues ont annoté 13 lettres."
    note_date: Date de l'annonce ; Luke Farritor a vu le mot en août 2023 selon la source.
    qui:
      - Luke Farritor
      - Youssef Nader
      - Casey Handmer
    prix:
