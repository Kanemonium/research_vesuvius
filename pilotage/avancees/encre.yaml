  - id: A-310
    branche: volume
    date: 2026-06-25
    titre: Encre directement visible et segmentée en 3D dans PHerc. Paris. 4
    statut: acquis
    resume: Sur un scan à plus haute résolution du rouleau 1, l'encre se voit directement dans le volume 3D et
      peut être segmentée voxel par voxel.
    fonctionnel: "L'encre segmentée en 3D puis projetée sur la page correspond terme à terme au texte lu en 2023 :
      c'est une confirmation indépendante, sur de meilleures données. La segmentation 3D directe donne une
      cible plus propre que les étiquettes 2D. Tous les rouleaux ne se comporteront pas ainsi."
    technique: Scan de PHerc. Paris. 4 à 2,4 µm. Le point de contrôle ink_3d_dino_guided est un U-Net 3D entraîné
      spécifiquement pour ce rouleau, guidé par des plongements (embeddings) DINO 3D et par auto-distillation
      à partir d'un autre modèle d'encre 3D. Un autre entraîneur apprend 4 classes (fond, fibre verticale,
      fibre horizontale, encre) sans aucune étiquette de vérité terrain, à partir de deux réseaux «
      professeurs » gelés.
    note_date: Annoncé avec la lecture de PHerc. 1667 ; les modèles DINO et d'auto-distillation sont décrits dans
      la page du 14 octobre 2026.
    qui:
      - Vesuvius Challenge
    fiches:
      - K-22
      - K-23
    pistes:
      - P-330
      - P-340
