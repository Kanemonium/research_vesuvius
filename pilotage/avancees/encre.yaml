  - id: A-301
    branche: signal
    date: null
    titre: L'encre est détectable par apprentissage, mais seulement sur des fragments
    statut: acquis
    resume: Stephen Parsons, dans le laboratoire de Brent Seales, montre qu'un modèle peut retrouver l'encre
      d'Herculanum dans un scan, sur de petits fragments détachés.
    fonctionnel: C'est la preuve de principe qui a motivé la création du défi. À ce stade, personne n'avait
      détecté d'encre dans le scan d'un rouleau entier.
    technique: "L'encre d'Herculanum est radiotransparente (radiolucent) : presque invisible aux rayons X. Le
      modèle est entraîné avec, en entrée, le scan du fragment autour de la surface et, en étiquette, l'encre
      visible sur la photographie infrarouge alignée. Référence citée : la thèse de Stephen Parsons et
      l'article « EduceLab-Scrolls »."
    note_date: Travaux antérieurs au lancement de mars 2023 ; l'article EduceLab-Scrolls cité est de 2023
      (arXiv:2304.02084). La source ne donne pas de date précise.
