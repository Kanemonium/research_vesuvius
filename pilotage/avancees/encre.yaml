  - id: A-306
    branche: volume
    date: "2024"
    titre: "2024 : des mots dans un second rouleau, encre en 3D, objectif 90 % manqué de loin"
    statut: acquis
    resume: En 2024, des mots sont extraits d'un second rouleau fermé, et un modèle détecte l'encre directement en
      3D, pendant que le défi vise la lecture de 90 % de quatre rouleaux.
    fonctionnel: "La réussite de 2023 n'était pas un cas unique. Mais la bannière du Grand Prix 2023, notée selon
      la grille 2024, n'atteignait que 67 % de lignes acceptées pour 90 % exigés : il fallait de plus grandes
      segmentations et une meilleure récupération d'encre."
    technique: "Modèle 3D de Ryan Chesler (20 000 $, avril 2024) : détection d'encre sur le rouleau complet, sans
      segmentation ni aplatissement. Grille 2024 : chaque ligne est jugée lisible, illisible, « peut-être » ou
      incomplète ; sur la bannière 2023, 240 lignes dont 206 complètes et 137 acceptées. Expériences
      communautaires la même année : pré-entraînement auto-supervisé et DINO pour l'encre (Jorge
      García-Carrasco)."
    note_date: Année ; le prix « 3D ink detection » est d'avril 2024. Le second rouleau n'est pas nommé dans les
      fichiers lus.
