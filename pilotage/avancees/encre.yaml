  - id: A-305
    branche: lectures
    date: 2023-12-31
    titre: "Grand Prix 2023 : 15 colonnes lues avec un modèle TimeSformer"
    statut: acquis
    resume: L'équipe de Youssef Nader, Luke Farritor et Julian Schilliger fait lire plus de 2000 caractères du
      rouleau 1.
    fonctionnel: "Environ 5 % du premier rouleau sont déroulés et lus : un texte philosophique épicurien inédit
      sur le plaisir. Le code est publié en open source, et quatre équipes indépendantes obtiennent des images
      très proches de la même zone, ce qui écarte l'invention de texte."
    technique: "Trois architectures de modèles, les images les plus nettes venant souvent d'un modèle fondé sur
      TimeSformer (image principale : TimeSformer 64x64). Garde-fous contre le surapprentissage et
      l'hallucination : plusieurs architectures, étude sur les tailles de fenêtre d'entrée/sortie, lissage
      d'étiquettes (label smoothing), plis de validation variés. Critère atteint : 4 passages de 140
      caractères avec au moins 85 % de caractères récupérables ; plus 11 autres colonnes. Trois deuxièmes ex
      æquo à 50 000 $."
    note_date: Date limite et date retenue par la page des lauréats ; annonce des gagnants le 5 février 2024.
