  - id: A-311
    branche: signal
    date: "2026"
    titre: Le relief de surface seul permet de prédire l'encre
    statut: acquis
    resume: Sur des fragments ouverts, la forme de la surface mesurée par profilométrie optique suffit à
      distinguer les zones encrées.
    fonctionnel: Cela relie directement la résolution spatiale à la quantité de signal d'encre qui survit, et
      plaide pour des voxels plus petits. Mais l'encre n'apparaît pas toujours comme un simple relief.
    technique: "Modèles (nnU-Net) entraînés sur des cartes de hauteur (heightmaps) de fragments ouverts
      mécaniquement : PHerc. 248, PHerc. 250, PHerc. 500P2. L'étude mesure la dégradation de la détection
      quand on grossit la résolution latérale. Le signal peut dépendre de la texture fine, de la rugosité, de
      craquelures, de dépôts ou de déformations."
    note_date: Année de publication de l'article cité (Scientific Reports, 2026).
