  - id: A-303
    branche: signal
    date: 2023-08
    titre: "Le « crackle » : première encre vue dans un rouleau fermé"
    statut: acquis
    resume: Casey Handmer repère à l'œil, dans les surfaces aplaties, une texture craquelée qui dessine des lettres.
    fonctionnel: C'est la première preuve directement visible d'encre et de lettres dans un rouleau complet. Elle
      a inspiré directement le travail de Luke Farritor et amélioré la compréhension du signal d'encre.
    technique: Découverte par inspection visuelle prolongée des « surface volumes » bruts produits par l'équipe de
      segmentation. Le crackle est une texture de boue craquelée, légèrement en relief sur le papyrus ; il est
      rare. La source précise que dans PHerc. Paris. 4, l'encre peut former une fine couche à la surface du
      papyrus.
    note_date: « In early August » ; le billet de blog cité porte la date 2023/08/05 dans son adresse.
    qui:
      - Casey Handmer
    prix:
      nom: First Ink Prize
      montant: $10,000
    fiches:
      - K-18
      - K-07
    sources:
      - titre: scrollprize.org · firstletters
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/22_firstletters.md
