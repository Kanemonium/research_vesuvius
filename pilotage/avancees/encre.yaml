  - id: A-309
    branche: lectures
    date: 2026-06-25
    titre: PHerc. 1667 lu en entier par pseudo-étiquetage itératif ; titre de PHerc. 139
    statut: acquis
    resume: Le texte conservé d'un rouleau fermé est lu en continu pour la première fois, grâce à des modèles
      ré-entraînés tour après tour sur leurs propres prédictions vérifiées par un humain.
    fonctionnel: "Les parties basses d'environ vingt-deux colonnes sont transcrites et relues par des papyrologues
      : un traité d'éthique, probablement stoïcien. Dans un troisième rouleau, PHerc. 139, le titre et
      l'auteur sont retrouvés (Philodème, « Sur les dieux », livre 8)."
    technique: "Six points de contrôle (itérations 0 à 5) partagent la même architecture : un squelette
      ResNet3D-50 initialisé avec des poids Kinetics-700 (vidéo), suivi d'un décodeur U-Net 2D, et le même
      budget d'entraînement ; seule change la quantité de données pseudo-étiquetées. Le modèle 0 n'est pas
      entraîné sur PHerc. 1667. Une région de validation, jamais utilisée pour créer des étiquettes, devient
      de plus en plus lisible."
    qui:
      - Vesuvius Challenge
      - G. Angelotti et co-auteurs (arXiv:2606.29085)
    fiches:
      - K-09
      - K-24
      - K-16
