  - id: A-312
    branche: generalisation
    date: 2026-09-06
    titre: Modèles pré-entraînés multi-rouleaux à 9 µm et premiers progrès de généralisation
    statut: en-cours
    resume: L'équipe partage des détecteurs d'encre entraînés sur quatre rouleaux à la fois, pour chercher de
      l'encre dans des rouleaux jamais lus.
    fonctionnel: On peut partir de la seule géométrie d'un segment, le rendre, appliquer les modèles partagés et
      regarder. Un essaim d'agents autonomes a trouvé une configuration qui a presque doublé le score de
      validation sur PHerc. 1667 en n'entraînant que sur PHerc. 139. Le modèle courant à 2,4 µm est
      ink_canonical_2um.
    technique: "Modèles scrollprize/ink_9um : petite tête 3D suivie d'un U-Net 2D (hybride 3D vers 2D), sur un
      patch de 17 tranches ; étiquettes alignées de PHerc. 0139, PHerc. 1667, PHerc. Paris. 4 et PHerc. 0814 à
      environ 9 µm isotrope ; deux graines (42 et 43), sept points de contrôle chacun. Recette : 24 segments
      annotés sur rendus 2,4 µm regroupés et 5 sur rendus natifs 9,362 µm, quotas par rouleau fixes par lot
      (29/22/11/2 sur 64), lissage d'étiquettes 0,5. Entraînement complet : 78 125 itérations, environ cinq
      heures sur un H100. Le score Dice de l'essaim d'agents est calculé sur des pseudo-étiquettes."
    note_date: Date de dernière mise à jour du tutoriel de détection d'encre, qui présente les modèles « 9 µm » ;
      le jeu « ink-labels » est daté 2026-07 ; l'essaim d'agents est postérieur à mars 2026 (date non
      précisée).
