  - id: A-302
    branche: lectures
    date: 2023-07-14
    titre: Compétition Kaggle de détection d'encre sur fragments
    statut: acquis
    resume: Des centaines d'équipes cherchent le meilleur modèle pour détecter l'encre dans les fragments ouverts,
      où la vérité terrain vient des photos.
    fonctionnel: La compétition produit d'excellents modèles sur fragments, mais ils ne fonctionnent pas tels
      quels sur les segments aplatis des rouleaux. Ils serviront de base à Youssef Nader pour les premières
      lettres.
    technique: "Étiquettes : vérité terrain issue directement des photos des fragments (et non du « crackle »,
      inconnu à l'époque). Premier prix : « ryches » (25 000 $), identifié comme Ryan Chesler dans la liste
      des projets communautaires. Un prix de suivi (12 000 $, 8 septembre 2023) demandait d'appliquer ces
      modèles aux rouleaux."
    note_date: Date de la page des lauréats. La page archivée du concours donne une date limite au 14 juin 2023
      (voir « contradictions »).
