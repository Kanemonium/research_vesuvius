  - id: A-207
    branche: outils
    date: 2025-02-20
    titre: "VC3D : croissance de patchs (GrowPatch), traceur et copie vers les tours voisins"
    statut: acquis
    resume: VC3D fait pousser un maillage le long de la surface prédite à partir d'un point de départ, puis
      recopie le tracé sur les tours voisins.
    fonctionnel: "Le traçage est fortement accéléré, mais reste semi-automatique : il faut inspecter et corriger.
      La copie vers les tours voisins est un accélérateur, pas un remplacement de la vérification, car une
      erreur locale se propage."
    technique: "GrowPatch optimise à la fois : suivre la surface prédite, garder une géométrie lisse, un
      espacement raisonnable, l'orientation locale (grilles de normales), et ne pas sauter sur une feuille
      voisine ; il utilise le solveur Ceres. Le traceur relie des milliers de patchs se recouvrant : une trace
      peut couvrir 10 cm² comme 2800 cm² ; un exemple de 53 cm² sur PHerc0172 a pris environ une minute. Une
      version neuronale de Copy Out/In existe (copy_displacement_latest, entraînée sur des données 2,4 µm
      réduites à 4,8 µm)."
    relu: true
    note_date: Date de la dernière mise à jour du tutoriel de segmentation VC3D (archivé) ; la description de
      GrowPatch et de Copy Out/In vient de la page du 14 octobre 2026.
    qui:
      - Vesuvius Challenge
    pistes:
      - P-220
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
