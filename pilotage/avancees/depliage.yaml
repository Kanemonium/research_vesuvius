  - id: A-210
    branche: automatique
    date: null
    titre: "Lasagna : optimiser plusieurs feuilles empilées en même temps"
    statut: acquis
    resume: Lasagna est une alternative à GrowPatch qui ajuste une ou plusieurs feuilles voisines ensemble pour
      qu'elles restent cohérentes.
    fonctionnel: Il épouse mieux les zones complexes et courbées, au prix d'un calcul plus lourd. Il sert aussi à
      corriger localement une surface brouillon et à suivre des fibres à partir de quelques points placés à la
      main.
    technique: "Optimisation globale en PyTorch de piles de maillages à faces quadrangulaires qui ne se croisent
      pas. Entrées plus riches qu'une simple prédiction de surface : un volume dense de normales prédit par
      U-Net, et un volume de « magnitude de gradient » dérivé d'un champ de position fractionnaire
      d'enroulement, qui indique à quel point les tours sont serrés."
    relu: true
    note_date: Décrit dans la page du 14 octobre 2026, sans date de mise en service.
    qui:
      - Vesuvius Challenge
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
  - id: A-211
    branche: surface
    date: null
    titre: Format tifxyz et aplatissement par flatboi (SLIM)
    statut: acquis
    resume: La surface est stockée comme une grille de points 3D (tifxyz) puis aplatie en cherchant à conserver
      les distances.
    fonctionnel: Le format impose une topologie de grille, donc une seule feuille plate, et porte directement le
      système de coordonnées 2D. C'est le format de maillage exigé pour les soumissions au Grand Prix 2027,
      aux prix « First Letters » et au prix du titre ; les prix de progrès acceptent aussi d'autres formats.
    technique: "tifxyz : un tableau 2D de coordonnées 3D, enregistré en trois images TIFF (x, y, z en float32),
      avec cellules manquantes marquées à -1 ou par un masque. L'outil d'aplatissement en production, flatboi,
      utilise SLIM (Scalable Locally Injective Mappings) et minimise l'énergie de Dirichlet symétrique."
    relu: true
    note_date: Décrit dans la page du 14 octobre 2026, sans date.
    qui:
      - Vesuvius Challenge
    fiches:
      - K-07
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
  - id: A-212
    branche: automatique
    date: "2026"
    titre: "Ajustement de spirale : une surface globale pour tout le rouleau"
    statut: acquis
    resume: On part d'une spirale idéale et on la déforme pour qu'elle colle à tous les indices disponibles ;
      c'est l'état de l'art pour segmenter un rouleau entier.
    fonctionnel: "On obtient un résultat unique et cohérent à partir d'annotations éparses, en comblant les petits
      trous. PHerc. Paris. 4 a été ajusté sur 130 tours. Limite reconnue : là où les annotations sont rares ou
      le volume ambigu, la spirale ne suit pas forcément les vraies feuilles."
    technique: "La déformation est représentée par un champ de vitesse stationnaire (difféomorphisme). Indices
      utilisés : patchs tracés, squelettes de fibres, squelettes de prédiction de surface, contraintes de
      points (même tour, un tour d'écart, numéro de tour absolu), champs de normales, ombilic. Contraintes
      dures (vérifiées) préférées aux contraintes souples. Jeu « spiral-input » pour PHercParis4 : environ 27
      000 patchs vérifiés et 204 000 non vérifiés (environ 49,6 Go)."
    relu: true
    note_date: Année de la publication citée (Henderson, WACV 2026) ; le jeu de données « spiral-input » est daté
      2026-07 et le tutoriel du 16 septembre 2026.
    qui:
      - Paul Henderson
    fiches:
      - K-06
    pistes:
      - P-240
    sources:
      - titre: scrollprize.org · 2026 open problems
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/37_2026_open_problems.md
