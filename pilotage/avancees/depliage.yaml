  - id: A-201
    branche: jalons
    date: "2015"
    titre: "Précédent : le rouleau d'En-Gedi déroulé virtuellement"
    statut: acquis
    resume: L'équipe du Dr Seales déroule virtuellement le rouleau d'En-Gedi, première réussite du déroulement
      virtuel.
    fonctionnel: "Cela prouve que la méthode (scanner, tracer la surface, aplatir, lire) fonctionne. Les rouleaux
      d'Herculanum sont plus difficiles : très longs, serrés, abîmés, et leur encre est presque invisible aux
      rayons X."
    technique: "Mêmes étapes que pour Herculanum, avec une différence clé : l'encre d'Herculanum est
      radiotransparente (radiolucent). En 2023, la source indique que personne n'avait encore réussi une
      segmentation à grande échelle de ces rouleaux."
    relu: true
    qui:
      - Dr. Seales's team
    fiches:
