  - id: A-213
    branche: jalons
    date: 2026-06-25
    titre: PHerc. 1667 entièrement déroulé virtuellement
    statut: acquis
    resume: Pour la première fois, le texte conservé d'un rouleau d'Herculanum est déroulé numériquement et lu en
      continu, d'un bout à l'autre, sans être ouvert ; les lectures restent fragmentaires, avec des lacunes là
      où la surface est perdue.
    fonctionnel: "On ne se demande plus si un rouleau fermé peut être lu : c'est fait. La question devient de
      rendre le procédé automatique, fiable et applicable à tous les rouleaux."
    technique: Surface d'écriture complète d'environ 1,4 mètre de papyrus ; le texte lu correspond aux parties
      basses d'environ vingt-deux colonnes de grec, transcrites et relues par des papyrologues. Il s'agit du
      cœur conservé du rouleau (environ 8 cm sur une hauteur d'origine de 19 à 24 cm), les couches externes
      ayant été détruites par d'anciennes tentatives d'ouverture. Scan sur BM18 (ESRF).
    relu: true
    qui:
      - Vesuvius Challenge
      - ESRF
      - National Library of Naples “Vittorio Emanuele III”
    fiches:
      - K-06
    sources:
      - titre: scrollprize.org · firstscroll
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/36_firstscroll.md
  - id: A-214
    branche: automatique
    date: "2026"
    titre: Contraintes d'enroulement, fibres et mailleurs automatiques de la communauté
    statut: en-cours
    resume: L'équipe demande désormais des méthodes rapides pour produire des « contraintes d'enroulement » qui
      alimentent la spirale ; la communauté livre des extracteurs de fibres et un mailleur automatique.
    fonctionnel: "Le but change : au lieu de produire de grandes segmentations, on cherche des indices locaux
      précis et on laisse la compréhension globale à la spirale. La quantité d'indices nécessaire est inconnue
      d'avance mais bien inférieure à une segmentation complète."
    technique: "ScrollFiesta (Ben Kyles, 20 000 $, juillet 2026) : mailleur de surface automatique, zarr en entrée
      et tifxyz en sortie, qui produit des contraintes pour la spirale. Extraction automatique de fibres
      (Samir Lerognon, 20 000 $, septembre 2026) : modèles de fibres affinés sur plus de rouleaux, splines
      ajustées aux fibres prédites, intégration à VC3D et à la spirale. Un modèle nnUNet de fibres
      (fiber_hz_vt) vient d'annotations tracées à la main sur les anciens scans à 7,91 µm."
    relu: true
    note_date: Prix de progrès de juillet à octobre 2026 ; la page sur les contraintes d'enroulement n'a pas de
      date lue.
    qui:
      - Ben Kyles
      - Samir Lerognon
      - Vesuvius Challenge
    prix:
      nom: Progress Prizes (ScrollFiesta, juillet 2026 ; Automated fiber extraction, septembre 2026)
      montant: $20,000 + $20,000
    pistes:
      - P-230
