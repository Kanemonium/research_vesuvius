  - id: A-206
    branche: automatique
    date: 2024-12
    titre: "Prix de segmentation automatique : ajustement de spirale et traceur de surface"
    statut: acquis
    resume: "Deux méthodes sont soumises au premier prix de segmentation automatique : l'ajustement de spirale de
      Paul Henderson et le traceur de surface de Hendrik Schilling et Sean Johnson."
    fonctionnel: "Ces deux approches deviennent l'état de l'art du déroulement : l'une globale (du haut vers le
      bas), l'autre locale (du bas vers le haut). Aucune n'a atteint le critère de qualité du prix ; l'erreur
      la plus fréquente reste le saut de feuille."
    technique: "Le prix demandait de re-segmenter la zone du Grand Prix 2023 avec au plus 4 heures d'intervention
      humaine et 48 heures de calcul. Les deux méthodes partent d'une représentation intermédiaire : une
      prédiction de surface par nnUNet, à laquelle la spirale ajoute les fibres verticales et horizontales. La
      source précise que ces prédictions contiennent des erreurs (fausses fusions, trous). La spirale cherche
      un difféomorphisme 3D déformant une spirale canonique ; le traceur étend des patchs localement puis les
      fusionne par consensus. Soumission spirale : presque aucune intervention humaine ; traceur : 4 heures."
    relu: true
    note_date: Mois indiqué par la page des lauréats ; la date limite du prix était le 31 décembre 2024.
    qui:
      - Paul Henderson
      - Hendrik Schilling
      - Sean Johnson
    prix:
      nom: First Automated Segmentation Prize (annoncé à $100,000 ; la page des lauréats indique $60,000 attribués,
        soit $30,000 par équipe)
      montant: $60,000
    sources:
      - titre: scrollprize.org · unwrapping
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/32_unwrapping.mdx
