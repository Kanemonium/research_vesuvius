  - id: A-205
    branche: automatique
    date: 2023-12-31
    titre: "ThaumatoAnakalyptor : la plus forte approche de segmentation automatique vue à cette date"
    statut: acquis
    resume: La soumission gagnante du Grand Prix 2023 contient l'outil de Julian Schilliger, qui produit
      automatiquement de très grands segments.
    fonctionnel: Des re-segmentations de zones connues confirment les lectures d'encre, et de nouvelles zones
      révèlent de l'écriture, par exemple sur le tour le plus externe du rouleau. La source précise qu'il
      reste beaucoup à faire pour améliorer cet outil.
    technique: Combine des méthodes classiques (détecteurs de bords par opérateur de gradient seuillé) et une
      segmentation d'instances de nuages de points par apprentissage profond, pour détecter, fusionner et
      rendre des segments.
    relu: true
    note_date: Date de clôture du Grand Prix 2023 ; résultat annoncé le 5 février 2024.
    qui:
      - Julian Schilliger
    prix:
      nom: Grand Prize 2023 (partie de la soumission gagnante)
      montant: $700,000
