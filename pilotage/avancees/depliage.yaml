        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/35_segmentation.md
  - id: A-208
    branche: automatique
    date: 2025-07
    titre: "Constat : le traçage reste le goulot, trop lent et trop cher"
    statut: ouvert
    resume: En 2025, le déroulement repose sur un traçage semi-automatique corrigé à la main, encore trop lent et
      sujet aux erreurs.
    fonctionnel: "À ce coût, dérouler les 300 rouleaux est hors de portée : il faut une percée vers
      l'automatisation. L'équipe dit croire possible de ramener le coût du déroulement d'un rouleau entier à 5
      000 $ ou moins."
    technique: Un rouleau entier mesure 10 à 20 cm de large et jusqu'à 15 mètres de long ; la source estime le
      coût actuel à 1 à 5 millions de dollars par rouleau. Certaines parties sont si compressées que les
      techniques actuelles ne peuvent pas les dérouler. Début 2024, le coût manuel était de plus de 100 $ par
      cm².
    relu: true
    note_date: Date de la page « Master Plan » (25 juillet 2025).
    qui:
      - Vesuvius Challenge
    sources:
      - titre: scrollprize.org · master plan
        lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/27_master_plan.md
