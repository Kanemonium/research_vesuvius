  - id: A-209
    branche: surface
    date: 2025-11
    titre: "Compétition Kaggle « Surface Detection » : nnU-Net s'impose"
    statut: acquis
    resume: Une compétition dédiée récompense les modèles qui prédisent la surface du papyrus sans trous ni
      fusions de feuilles.
    fonctionnel: Le modèle issu de la solution gagnante (« m7 ») est aujourd'hui un des deux points de contrôle
      sur lesquels s'appuie la chaîne de déroulement. Les prédictions restent des indices géométriques, pas
      une surface finie.
    technique: "La métrique tenait compte de la topologie : elle récompensait les prédictions connexes et sans
      trous et pénalisait trous, fusions et sauts de feuille. Recette gagnante : un nnU-Net standard configuré
      pour quelques tailles de patch, entraîné très longtemps (bien plus que les 1 000 époques par défaut),
      puis moyenne des prédictions (ensembling). Lauréats : 1er « Vesuvius Team » (60 000 $)."
    relu: true
    note_date: La page des problèmes ouverts situe la compétition en novembre 2025 ; la page des lauréats date les
      résultats de mars 2026.
    qui:
      - Vesuvius Team (1re place Kaggle)
      - risk of overfitting (2e)
      - W & A (3e)
