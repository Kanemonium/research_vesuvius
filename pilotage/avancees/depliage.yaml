  - id: A-202
    branche: outils
    date: null
    titre: Volume Cartographer, l'outil d'origine d'EduceLab
    statut: acquis
    resume: Volume Cartographer est la première boîte à outils de déroulement virtuel, créée par Seth Parker et
      d'autres dans le laboratoire de Brent Seales.
    fonctionnel: C'est l'outil avec lequel l'équipe de segmentation a tracé les feuilles de papyrus en 2023. Les
      participants l'ont amélioré, et une branche (fork) de Philip Allgaier a rassemblé les contributions de
      la communauté.
