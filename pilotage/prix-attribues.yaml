# Tous les prix attribués par le défi, d'après sa page des lauréats. Format : pilotage/README.md.
# Écrit par scripts/prix-depuis-releve.mjs (ScrollPrize/villa, commit 2d3fb38, licence MIT).
# Textes français et rangement par domaine : Agent C., pas une traduction officielle.
lu_le: 2026-11-15
source:
  titre: scrollprize.org · winners
  lien: https://github.com/ScrollPrize/villa/blob/2d3fb38d33a18b257230c0bd23986436c3d4722e/scrollprize.org/docs/15_winners.md
sections:
  - titre: Progress Prizes (October 2026)
    date: 2026-10
    total: $40,750
    but: Improve the tools and training methods needed to read the scrolls.
    laureats:
      - qui: Jaime Lomeli-Rodriguez / @jaimelomro_79060
        montant: $20,000
        intitule: Virtual unwrapping
        quoi: Divers travaux intéressants sur le déroulage virtuel (virtual unwrapping), dont HercUNet et HercuViT.
        domaine: depliage
      - qui: Domenico Russo / @klavis223
        montant: $5,000
        intitule: reader-v3 ink model
        quoi: Version mise à jour du modèle d'encre (ink model) à 9,6 µm, désormais utilisé dans la majorité des
          candidatures « First Letters ».
        domaine: encre
      - qui: Samir Lerognon / @qualzz
        montant: $2,500
        intitule: Automated fiber extraction
        quoi: "Suite du travail sur l'extraction automatique des fibres (automated fiber extraction) : modèles et
          traçage améliorés, nouvelle visualisation des fibres dans VC3D."
        domaine: depliage
      - qui: Leonel Wainer / @LimeGS
        montant: $1,000
        intitule: winding-field
        quoi: "Nouvelle approche de segmentation : ajuster un champ scalaire (scalar field) dont les isosurfaces
          entières correspondent aux surfaces d'enroulement."
        domaine: depliage
      - qui: Chase Hendrick / @Chase
        montant: $1,000
        intitule: Extending patches in VC3D
        quoi: Ajout à VC3D qui prolonge les morceaux de surface (patches) par des heuristiques appliquées directement
          au volume CT brut.
        domaine: depliage
      - qui: Ben Kyles / @hari_seldon and colleagues
        montant: $1,000
        intitule: ScrollFiesta pipeline
        quoi: Suite du travail sur la chaîne ScrollFiesta, dont un aplatissement UV guidé par les fibres (fiber-guided
          UV flattening).
        domaine: depliage
      - qui: Forrest McDonald / @forrest
        montant: $1,000
        intitule: UFSM
        quoi: Tentative de déroulage rapide de bout en bout (end-to-end unwrapping), qui produit de grandes étendues
          de surface cohérente sur plusieurs enroulements.
        domaine: depliage
      - qui: Leonel Wainer / @LimeGS and Paulo Sergio Camillo / @pscamillo
        montant: $500
        intitule: ink-sdk
        quoi: Outil qui permet de lancer facilement une batterie de modèles d'encre (ink models), de l'équipe et de la
          communauté, sur un segment.
        domaine: encre
      - qui: Leonel Wainer / @LimeGS
        montant: $500
        intitule: Discord chat search
        quoi: Service de recherche dans les discussions, qui donne un résumé à jour du contenu du Discord.
        domaine: outils
      - qui: Chase Hendrick / @Chase
        montant: $500
        intitule: Lossless CT compression
        quoi: Amélioration d'environ 10 % de la compression sans perte (lossless compression) des volumes CT dans
          vc-delta3d.
        domaine: outils
      - qui: Giovanni Pellerano / @evilaliv3
        montant: $500
        intitule: Assorted villa PRs
        quoi: Plusieurs PR fusionnées dans villa, surtout des corrections de justesse sur des outils en usage.
        domaine: outils
      - qui: Andreas Hadjinicolaou / @AndreasHad
        montant: $500
        intitule: Apple Silicon support
        quoi: Plusieurs PR fusionnées pour que les outils les plus utilisés fonctionnent sur Apple Silicon.
        domaine: outils
      - qui: Jude Wallis / @Jude
        montant: $500
        intitule: Umbilici for crushed scrolls
        quoi: Améliorations géométriques du générateur automatique d'ombilic (umbilicus), pour les rouleaux écrasés.
        domaine: depliage
      - qui: Teddy Ove Johannes Wasserman / @biggiejuke02
        montant: $500
        intitule: Ink pipeline improvements
        quoi: "Améliorations de confort et de vitesse de la chaîne d'encre (ink pipeline) : chargement des données
          plus rapide, plusieurs points de sauvegarde (checkpoints) lancés d'un coup sur la même entrée."
        domaine: encre
      - qui: Pray Apostel
        montant: $500
        intitule: windcon
        quoi: Extrait directement des données CT des contraintes « même enroulement » (same-winding constraints),
          utilisables pour les ajustements de spirale (spiral fits).
        domaine: depliage
      - qui: Tyler Phipps / @mlkman29
        montant: $500
        intitule: Assorted villa speed-ups
        quoi: Plusieurs petites accélérations du code villa en usage.
        domaine: outils
      - qui: William Stevens / @Will Stevens
        montant: $500
        intitule: Patch stitching optimisation
        quoi: Améliorations progressives de l'optimisation qui assemble de petits morceaux (patches) en surfaces.
        domaine: depliage
      - qui: Yupeng Tang / @ytang454
        montant: $500
        intitule: Comparing surface models
        quoi: Mesures chiffrées, par la cohérence de GrowPatch, de l'efficacité réelle de trois modèles de surface à 9
          µm pour la segmentation.
        domaine: depliage
      - qui: Giovanni Pellerano / @evilaliv3
        montant: $250
        intitule: Rectina ink model
        quoi: Un nouveau modèle d'encre (ink model) à 9 µm.
        domaine: encre
      - qui: Alexey Murashkin / @alexmur6692
        montant: $250
        intitule: VC3D on Windows
        quoi: Corrections de compatibilité Windows pour VC3D.
        domaine: outils
      - qui: Liam Warner / @Prodigle
        montant: $250
        intitule: Assorted villa PRs
        quoi: Trois corrections de bogues utiles sur des outils en usage.
        domaine: outils
      - qui: Mohamad Al-Zawahreh
        montant: $250
        intitule: Hecate on DirectML
        quoi: Un moteur d'exécution DirectML (DirectML backend) pour le modèle d'encre Hecate.
        domaine: encre
      - qui: Junlong Shen / @Jason
        montant: $250
        intitule: VC3D platform fixes
        quoi: Corrections de compatibilité entre plateformes pour VC3D.
        domaine: outils
      - qui: Ehimen Nathaniel
        montant: $250
        intitule: Zarr downsampling issue
        quoi: "A trouvé un défaut dans les données publiées : les niveaux zarr sous-échantillonnés (downsampled) ne
          gardaient que les premières tranches de profondeur. A aussi entraîné une version réduite de la
          recette ink9um."
        domaine: scan
      - qui: Vincent Lemonnier / @vskinox
        montant: $250
        intitule: Windows & ROCm fixes
        quoi: Corrections de compatibilité Windows et ROCm.
        domaine: outils
      - qui: Lucas Young / @LucasY
        montant: $250
        intitule: Spiral fitter on Mac
        quoi: Correction d'un bogue de l'ajusteur de spirale (spiral fitter) sur Mac, plus une petite correction de
          compilation Mac.
        domaine: outils
      - qui: Sebastien Chicoineau / @Seb_Chic and Chris Thomas
        montant: $250
        intitule: Windows & AMD fixes
        quoi: Corrections de compatibilité Windows pour VC3D, et corrections de prise en charge AMD pour l'ajusteur de
          spirale (spiral fitter) et Lasagna.
        domaine: outils
      - qui: Alex Haeseker
        montant: $250
        intitule: Assorted Windows PRs
        quoi: Plusieurs PR de compatibilité Windows fusionnées.
        domaine: outils
      - qui: Ryan Campbell / @campbelltron1
        montant: $250
        intitule: Mean-teacher training fixes
        quoi: Corrections de justesse de l'entraînement semi-supervisé « mean-teacher ».
        domaine: outils
      - qui: Hyojun Kwon / @jamiolrangmalrang4936
        montant: $250
        intitule: Copy displacement tracer fix
        quoi: Corrige un vrai bogue dans les modèles de traceur neuronal (neural tracer) « Copy displacement ».
        domaine: depliage
      - qui: Eugenio Giuseppe Nerelli / @nerln
        montant: $250
        intitule: Assorted villa PRs
        quoi: PR utiles de plateforme et de compatibilité pour VC3D et vesuvius.
        domaine: outils
      - qui: Matteo Bulloni / @matteobulloni_73362
        montant: $250
        intitule: Faster GrowPatch tracing
        quoi: Petites améliorations de vitesse du traçage de surface dans GrowPatch.
        domaine: depliage
      - qui: Antonio Alonso-Stepanov
        montant: $250
        intitule: Spiral fitter on Apple Silicon
        quoi: Correctif de compatibilité Apple Silicon (MPS) pour l'ajusteur de spirale (spiral fitter).
        domaine: outils
  - titre: "First Letters: PHerc. 306B (October, 2026)"
    date: 2026-10
    total: $50,000
    but: Find 10 letters within a 4 cm² area of a scroll where nothing has been read yet.
    laureats:
      - qui: Liam Warner (@Prodigle) and Nicola Bodill (@polytrope)
        montant: $50,000
        intitule: Winners
        quoi: "Ont trouvé de l'écriture dans PHerc. 306B, avec une lecture probable en grec que la source traduit par
          « that which is in itself desirable » (ce qui est désirable en soi). But du prix : 10 lettres dans
          une zone de 4 cm² d'un rouleau où rien n'avait encore été lu."
        domaine: encre
  - titre: "First Letters: PHerc. 343 (October, 2026)"
    date: 2026-10
    total: $50,000
    but: Find 10 letters within a 4 cm² area of a scroll where nothing has been read yet.
    laureats:
      - qui: Erwin Nieuwlaar
        montant: $50,000
        intitule: Winner
        quoi: "A trouvé, profondément à l'intérieur de PHerc. 343, un texte grec que la source traduit par «
          everything that happens / is generated » (tout ce qui arrive / est engendré). But du prix : 10
          lettres dans une zone de 4 cm² d'un rouleau où rien n'avait encore été lu."
        domaine: encre
  - titre: Progress Prizes (September 2026)
    date: 2026-09
    total: $40,500
    but: Improve the tools and training methods needed to read the scrolls.
    laureats:
      - qui: Samir Lerognon / @qualzz
        montant: $20,000
        intitule: Automated fiber extraction
        quoi: "Extraction automatique des fibres (automated fiber extraction) : affine les modèles de fibres existants
          sur les données d'autres rouleaux, ajuste des splines sur les fibres prédites et relie le tout à
          VC3D et à l'ajusteur de spirale."
        domaine: depliage
      - qui: Ben Kyles / @hari_seldon and team
        montant: $5,000
        intitule: ScrollFiesta pipeline
        quoi: La chaîne ScrollFiesta produit maintenant des surfaces très propres sur des zones assez grandes des
          rouleaux.
        domaine: depliage
      - qui: Domenico Russo / @klavis223
        montant: $5,000
        intitule: reader-v2 ink model
        quoi: Modèle d'encre (ink model) distillé sur des volumes natifs à 9,6 µm, désormais largement utilisé par la
          communauté.
        domaine: encre
      - qui: Houjing Huang
        montant: $1,000
        intitule: PLatS
        quoi: Approche de segmentation qui entraîne un modèle à apprendre un plongement par instance (instance
          embedding) des feuilles de papyrus.
        domaine: depliage
      - qui: Thomas Kelly / @thomas_35601
        montant: $1,000
        intitule: Assigning patches to windings
        quoi: Approche prometteuse pour rattacher les morceaux de surface (patches) aux enroulements globaux.
        domaine: depliage
      - qui: Forrest McDonald / @forrest
        montant: $1,000
        intitule: volcomp
        quoi: Compresseur par blocs (chunked compressor) pour les CT de rouleaux et les prédictions de modèles,
          désormais pris en charge par VC3D.
        domaine: outils
      - qui: Yupeng Tang / @ytang454
        montant: $500
        intitule: Full-scroll inferences
        quoi: A lancé des inférences sur rouleau entier avec plusieurs modèles de surface de l'équipe et de la
          communauté.
        domaine: depliage
      - qui: Aleksei Drobkov / @alyalya1404
        montant: $500
        intitule: Scroll umbilici
        quoi: A produit les ombilics (umbilici) de plusieurs rouleaux du prix.
        domaine: depliage
      - qui: Hyojun Kwon
        montant: $500
        intitule: Ink detection experiments
        quoi: Diverses expériences de détection d'encre avec étiquettes manuelles et pseudo-étiquettes (pseudo
          labels), mesurant entre autres la généralisation d'un rouleau à l'autre.
        domaine: encre
      - qui: Sergei Evland
        montant: $500
        intitule: Winding consistency checks
        quoi: A repéré un défaut non trivial dans find-inconsistent-windings et construit un outil qui facilite le
          contrôle de cohérence des contraintes d'enroulement (winding constraints).
        domaine: depliage
      - qui: Sebastien Chicoineau
        montant: $500
        intitule: ProbeGuide
        quoi: Expérience sur l'intérêt de filtrer les pseudo-étiquettes d'encre (ink pseudo-labels) par similarité de
          caractéristiques DINO.
        domaine: encre
      - qui: Christopher William Scheirer / @Chris Scheirer
        montant: $500
        intitule: Renderer memory fix
        quoi: Le moteur de rendu (renderer) ne charge plus que les blocs réellement nécessaires le long de la surface,
          ce qui réduit fortement la mémoire utilisée.
        domaine: outils
      - qui: Junfeng Lu / @Ausar
        montant: $500
        intitule: Faster Hecate inference
        quoi: Inférence Hecate plus rapide, plus un affinage (fine-tuning) de modèles d'encre et des comparaisons
          détaillées.
        domaine: encre
      - qui: Marcel Gwerder / @mg02346
        montant: $500
        intitule: Lighter ink training tutorial
        quoi: Le tutoriel d'entraînement d'encre ne télécharge plus que les données nécessaires à l'entraînement (2,4
          Go au lieu de 92 Go), avec d'autres corrections.
        domaine: encre
      - qui: Jashanjot Singh Gill and Nhat Nam Tran
        montant: $500
        intitule: Winding annotation tool
        quoi: Outil qui génère des annotations d'enroulement (winding annotations) pour l'ajusteur de spirale.
        domaine: depliage
      - qui: Christos Vasilopoulos / @chrisvas_12645
        montant: $250
        intitule: Assorted villa PRs
        quoi: Plusieurs PR utiles fusionnées dans villa.
        domaine: outils
      - qui: Kaden Pool / @thatguybrodie
        montant: $250
        intitule: Assorted villa PRs
        quoi: Cinq PR fusionnées dans villa, dont la correction du choix des couches d'entrée du modèle d'encre.
        domaine: outils
      - qui: Santiago Pelufo / @spelufo
        montant: $250
        intitule: Assorted villa PRs
        quoi: Plusieurs PR utiles fusionnées dans villa.
        domaine: outils
      - qui: Alex Clark
        montant: $250
        intitule: Ink ensembling
        quoi: Petites améliorations chiffrées de la détection d'encre par combinaison de modèles (ensembling).
        domaine: encre
      - qui: Eugenio Giuseppe Nerelli / @nerln
        montant: $250
        intitule: Assorted villa PRs
        quoi: Cinq PR fusionnées dans villa.
        domaine: outils
      - qui: Jonathan Marrs / @martian87
        montant: $250
        intitule: Assorted villa PRs
        quoi: Diverses PR utiles fusionnées dans villa.
        domaine: outils
      - qui: Sebastien Andersson
        montant: $250
        intitule: Horizontal flip in VC3D
        quoi: Ajoute le retournement horizontal (horizontal flip) à l'aperçu de rotation de VC3D.
        domaine: depliage
      - qui: Armando Gaona de Stefani / @Armando_Gaona
        montant: $250
        intitule: Lasagna on Windows
        quoi: Corrections pour la prise en charge de Windows par Lasagna.
        domaine: outils
      - qui: Shuhan Yang / @qizhiran
        montant: $250
        intitule: Spiral fitting & ink on Windows
        quoi: Prise en charge de Windows pour les flux d'ajustement de spirale (spiral fitting), d'aplatissement et
          d'encre.
        domaine: outils
      - qui: Miika Kestilä
        montant: $250
        intitule: Ink training leakage fix
        quoi: Corrige un bogue de fuite de données (data leakage) dans l'entraînement d'encre 3D.
        domaine: encre
      - qui: Bryant Le
        montant: $250
        intitule: Spiralising PHerc. 0211
        quoi: A « spiralisé » et publié une longueur notable de PHerc. 0211, plus une PR fusionnée.
        domaine: depliage
      - qui: Ryan Gurganious / @DarthCeltic85 and Daine Ball / @Clexious
        montant: $250
        intitule: Single-pass Hecate
        quoi: Fait prédire Hecate en une seule passe (single pass), soit environ 35 % de gain de vitesse.
        domaine: encre
  - titre: Progress Prizes (August 2026)
    date: 2026-08
    total: $31,000
    but: Improve the tools and training methods needed to read the scrolls.
    laureats:
      - qui: William Stevens
        montant: $20,000
        intitule: Patch-based unwrapping
        quoi: "Déroulage par morceaux (patch-based unwrapping) : détecte les morceaux chevauchants dont l'alignement
          2D implique des positions 3D incompatibles, les écarte et réunit le reste en composantes aplaties.
          Environ 365 cm² couverts sur PHerc. 1667."
        domaine: depliage
      - qui: Ben Kyles / @hari_seldon and collaborators
        montant: $2,500
        intitule: 9 µm surface model & ScrollFiesta fixes
        quoi: Modèle de surface à 9 µm réentraîné par distillation de prédictions à 2,4 µm (feuilles plus fines et
          plus continues), plus des corrections et améliorations de la chaîne de déroulage ScrollFiesta.
        domaine: depliage
      - qui: Domenico Russo
        montant: $1,000
        intitule: Ink checkpoint benchmarking
        quoi: Compare les 14 points de sauvegarde (checkpoints) d'encre à 9 µm publiés, et réentraîne à partir
          d'étiquettes denses d'un modèle professeur (teacher) plutôt que des bandes étiquetées à la main.
        domaine: encre
      - qui: Mihajlo Nestorović
        montant: $1,000
        intitule: Seeded sheet growing
        quoi: Modèle 3D entraîné qui fait croître une seule feuille de papyrus à partir d'une graine (seed), avec une
          chaîne qui produit des données d'entraînement plus difficiles.
        domaine: depliage
      - qui: Paulo Sergio Camillo / @pscamillo
        montant: $1,000
        intitule: How many depth slices?
        quoi: Vraies expériences d'entraînement sur le nombre de tranches de profondeur (depth slices) dont le modèle
          d'encre à 9 µm a réellement besoin.
        domaine: encre
      - qui: Santiago Pelufo
        montant: $1,000
        intitule: Lasagna & VC3D improvements
        quoi: Sept changements fusionnés dans villa, dont l'aplatissement sur GPU Mac dans Lasagna, une barre
          d'échelle HiDPI et diverses corrections de navigation et de recalage (registration).
        domaine: depliage
      - qui: Lutfiya Miller and Chris Müller
        montant: $1,000
        intitule: First Letters on PHerc. 0826
        quoi: Ont déroulé de bout en bout la démarche « First Letters » sur PHerc. 0826 et publié images, commandes,
          échecs et coûts, plus deux PR fusionnées.
        domaine: encre
      - qui: Benjamin Hamm
        montant: $1,000
        intitule: nnInteractive label refinement
        quoi: "Applique nnInteractive à l'affinage des étiquettes de surface (surface label refinement) : étiquettes
          bien plus proches de la vraie surface, avec encore quelques défauts topologiques."
        domaine: depliage
      - qui: Erwin Nieuwlaar
        montant: $500
        intitule: Dense pseudo-labels & checkpoint repair
        quoi: Étend la recette d'entraînement d'encre avec des pseudo-étiquettes denses tirées de scans natifs à 113
          keV, et répare un point de sauvegarde publié du Scroll 1 dont la couche de sortie non entraînée
          donnait des prédictions vides.
        domaine: encre
      - qui: Oleksandr Kozlenko
        montant: $500
        intitule: Assorted villa fixes
        quoi: "Plusieurs corrections utiles : entraînement, inférence, mise à l'échelle des coordonnées, métriques de
          validation et outils en ligne de commande."
        domaine: outils
      - qui: TAUIL Abd Elilah
        montant: $500
        intitule: Sustained PR work
        quoi: Travail de PR tout au long du mois, notamment pour que vesuvius.predict prétraite le CT de la même façon
          qu'à l'entraînement du modèle.
        domaine: outils
      - qui: Praneeth Reddy
        montant: $250
        intitule: Shared disk cache
        quoi: Rend le cache disque du traçage neuronal de villa disponible pour le flux général des modèles, pour ne
          plus retélécharger les mêmes blocs.
        domaine: outils
      - qui: Shuhan Yang
        montant: $250
        intitule: Spiral fitting on Windows
        quoi: Fait compiler et tourner les outils d'ajustement de spirale (spiral fitting) sous Windows avec moins de
          ressources de calcul, plus des correctifs qui réduisent le trafic et le temps de rendu sur volumes
          distants.
        domaine: outils
      - qui: Ryan Gurganious
        montant: $250
        intitule: VC3D agent bridge fixes
        quoi: Permet au pont d'agent (agent bridge) de VC3D de lancer Lasagna avec le volume choisi, et de télécharger
          de gros segments sans les déclarer manquants.
        domaine: outils
      - qui: Armando Gaona de Stefani
        montant: $250
        intitule: Checkpoint averaging
        quoi: Expériences soignées de moyenne de points de sauvegarde (checkpoint averaging) sur les modèles d'encre.
        domaine: encre
  - titre: Progress Prizes (July 2026)
    date: 2026-07
    total: $33,500
    but: Improve the tools and training methods needed to read the scrolls.
    laureats:
      - qui: Ben Kyles / @hari_seldon
        montant: $20,000
        intitule: ScrollFiesta
        quoi: "Poursuite du mailleur automatique de surface (automatic surface mesher) ScrollFiesta : désormais
          compatible villa (zarr en entrée, tifxyz en sortie), il se cale sur le papyrus dans le scan CT et
          produit des contraintes pour l'ajustement de spirale."
        domaine: depliage
      - qui: William Stevens
        montant: $2,500
        intitule: Optimising patch connectivity
        quoi: Repère et retire les zones à problème qui causent des sauts de feuille (sheet switching), en gardant une
          ossature de morceaux sûrs ; appliqué à tout le Scroll 4.
        domaine: depliage
      - qui: Alan Thompson
        montant: $1,000
        intitule: Portable GPU kernels for ScrollFiesta
        quoi: Pilote Rust/CubeCL pour le point chaud de projection « MLS-midpoint » de ScrollFiesta, qui tourne sur
          AMD, NVIDIA et WGPU.
        domaine: depliage
      - qui: Prasad Khake
        montant: $1,000
        intitule: Zarr 3 read fixes
        quoi: Corrige la lecture des zarr 3 multi-échelles dans la classe Volume de la bibliothèque Python vesuvius et
          rétablit un cache de blocs optionnel.
        domaine: outils
      - qui: Hyojun Kwon
        montant: $1,000
        intitule: Ink detection validation harness
        quoi: Tutoriel de détection d'encre retravaillé avec de vraies partitions de validation mises à l'écart
          (held-out), plus un correctif amont de dépassement mémoire (OOM).
        domaine: encre
      - qui: Josep Carreras
        montant: $1,000
        intitule: windcheck
        quoi: Détecte les auto-intersections (self-intersections) dans les surfaces tifxyz, pour attraper les erreurs
          silencieuses de croisement d'enroulements lors d'un filtrage à grande échelle.
        domaine: depliage
      - qui: Aviad Cohen
        montant: $1,000
        intitule: TIFXYZ Doctor
        quoi: Outil déterministe de contrôle qualité et de tri des grilles de surface tifxyz (métadonnées, cohérence,
          distorsion, topologie), plus un correctif de bornes fusionné dans VC3D.
        domaine: depliage
      - qui: J. Miguel Giraldo
        montant: $1,000
        intitule: Faster decohesion augmentation
        quoi: A vectorisé l'augmentation d'entraînement DecohesionTransform, en remplaçant une boucle de noyau GPU
